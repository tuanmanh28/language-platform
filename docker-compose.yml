# Local dev environment. Before running: ./gradlew :backend:shadowJar
#   docker compose up --build
# API: http://localhost:8080/health
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Unused in Phase 1 (the API serves bundled tests) — reserved for the PostgreSQL step.
      DATABASE_URL: "jdbc:postgresql://db:5432/language_platform"
      DATABASE_USER: "app"
      DATABASE_PASSWORD: "app"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: language_platform
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d language_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
