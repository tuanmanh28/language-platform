openapi: 3.0.3
info:
  title: Language Platform API
  description: IELTS practice platform backend.
  version: 0.1.0
servers:
  - url: /
tags:
  - name: health
  - name: reading
  - name: listening
  - name: users
  - name: attempts
  - name: writing
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Report service status, version, environment and database reachability
      responses:
        "200":
          description: Service and database are up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/reading/tests:
    get:
      tags: [reading]
      operationId: listReadingTests
      summary: List published reading tests, including private ones for owners
      security:
        - {}
        - firebase: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Published reading tests
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingTestSummary"
        "304":
          $ref: "#/components/responses/NotModified"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/reading/tests/{id}:
    get:
      tags: [reading]
      operationId: getReadingTest
      summary: Get a reading test with its passages and questions; private tests are 404 except for owners
      security:
        - {}
        - firebase: []
      parameters:
        - $ref: "#/components/parameters/TestId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The reading test
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingTest"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/reading/tests/{id}/submit:
    post:
      tags: [reading]
      operationId: submitReadingAnswers
      summary: Score answers to a reading test; private tests are 404 except for owners
      security:
        - {}
        - firebase: []
      parameters:
        - $ref: "#/components/parameters/TestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswersRequest"
      responses:
        "200":
          description: Scored result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/listening/tests:
    get:
      tags: [listening]
      operationId: listListeningTests
      summary: List published listening tests, including private ones for owners
      security:
        - {}
        - firebase: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Published listening tests
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListeningTestSummary"
        "304":
          $ref: "#/components/responses/NotModified"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/listening/tests/{id}:
    get:
      tags: [listening]
      operationId: getListeningTest
      summary: >-
        Get a listening test with its sections, absolute audio URLs, transcripts and questions;
        private tests are 404 except for owners
      security:
        - {}
        - firebase: []
      parameters:
        - $ref: "#/components/parameters/TestId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The listening test
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListeningTest"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/listening/tests/{id}/submit:
    post:
      tags: [listening]
      operationId: submitListeningAnswers
      summary: Score answers to a listening test; private tests are 404 except for owners
      security:
        - {}
        - firebase: []
      parameters:
        - $ref: "#/components/parameters/TestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswersRequest"
      responses:
        "200":
          description: Scored result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListeningResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/listening/audio/{testId}/{fileName}:
    get:
      tags: [listening]
      operationId: streamPrivateListeningAudio
      summary: >-
        Stream private section audio from CONTENT_DIR/audio to the owner; only mounted with AUDIO_STORAGE=local
      security:
        - firebase: []
      parameters:
        - name: testId
          in: path
          required: true
          schema:
            type: string
        - name: fileName
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: Byte range to seek within the file
          schema:
            type: string
      responses:
        "200":
          description: The audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range of the audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such file, or the signed-in user is not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: Get the signed-in user, creating it on first use
      security:
        - firebase: []
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/attempts:
    post:
      tags: [attempts]
      operationId: submitAttempt
      summary: Score a practice attempt on the server and store it, once per clientId
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAttemptRequest"
      responses:
        "201":
          description: The attempt was scored and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attempt"
        "200":
          description: An attempt with this clientId was already stored; it is returned unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [attempts]
      operationId: listAttempts
      summary: List the signed-in user's attempts, newest synced first
      security:
        - firebase: []
      parameters:
        - name: since
          in: query
          required: false
          description: >-
            Only attempts synced after this time, minus a 30-second overlap so late commits are not missed;
            deduplicate the results by clientId
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: Opaque nextCursor from the previous page; returns the attempts after it
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/writing/prompts:
    get:
      tags: [writing]
      operationId: listWritingPrompts
      summary: List published writing prompts, including private ones for owners
      security:
        - firebase: []
      responses:
        "200":
          description: Published writing prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WritingPrompt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/writing/submissions:
    post:
      tags: [writing]
      operationId: submitWriting
      summary: >-
        Store an essay for grading with its IELTS word count; private prompts are 404 except for owners
      security:
        - firebase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWritingRequest"
      responses:
        "201":
          description: The essay was stored as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WritingSubmission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Writing prompt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [writing]
      operationId: listWritingSubmissions
      summary: List the signed-in user's essays, newest first
      security:
        - firebase: []
      responses:
        "200":
          description: The user's essays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WritingSubmission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/writing/submissions/{id}:
    get:
      tags: [writing]
      operationId: getWritingSubmission
      summary: Get one of the signed-in user's essays
      security:
        - firebase: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The essay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WritingSubmission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such essay, or it belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/writing/images/{promptId}/{fileName}:
    get:
      tags: [writing]
      operationId: getPrivateWritingImage
      summary: >-
        Serve a private prompt image from CONTENT_DIR/images to the owner; only mounted with AUDIO_STORAGE=local
      security:
        - firebase: []
      parameters:
        - name: promptId
          in: path
          required: true
          schema:
            type: string
        - name: fileName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The image file
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such file, or the signed-in user is not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    firebase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token of the signed-in user
  parameters:
    TestId:
      name: id
      in: path
      required: true
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag from a previous response; a match returns 304
      schema:
        type: string
  headers:
    ETag:
      description: Content version, quoted
      schema:
        type: string
    CacheControl:
      description: >-
        "public, no-cache" for anonymous requests and "private, no-cache" for signed-in ones, so clients revalidate
        with the ETag and shared caches never store private content
      schema:
        type: string
  responses:
    NotModified:
      description: Content is unchanged since the given ETag
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
    BadRequest:
      description: Malformed request body or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: >-
        Missing, invalid or expired Firebase ID token; an invalid token is rejected even where signing in is optional
    NotFound:
      description: Test not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required: [message]
      properties:
        message:
          type: string
    UserProfile:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
    HealthResponse:
      type: object
      required: [status, version, env, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        env:
          type: string
          enum: [local, staging, prod]
        database:
          type: string
          enum: [up, down]
    IeltsModule:
      type: string
      enum: [academic, general_training]
    QuestionType:
      type: string
      enum: [multiple_choice, true_false_not_given, yes_no_not_given, sentence_completion]
    ReadingTestSummary:
      type: object
      required: [id, title, module, timeLimitMinutes, questionCount]
      properties:
        id:
          type: string
        title:
          type: string
        module:
          $ref: "#/components/schemas/IeltsModule"
        timeLimitMinutes:
          type: integer
        questionCount:
          type: integer
    ReadingTest:
      type: object
      required: [id, schemaVersion, module, title, timeLimitMinutes, passages]
      properties:
        id:
          type: string
        schemaVersion:
          type: integer
        module:
          $ref: "#/components/schemas/IeltsModule"
        title:
          type: string
        timeLimitMinutes:
          type: integer
        passages:
          type: array
          items:
            $ref: "#/components/schemas/Passage"
    Passage:
      type: object
      required: [id, title, paragraphs, questionGroups]
      properties:
        id:
          type: string
        title:
          type: string
        paragraphs:
          type: array
          items:
            $ref: "#/components/schemas/Paragraph"
        questionGroups:
          type: array
          items:
            $ref: "#/components/schemas/QuestionGroup"
    Paragraph:
      type: object
      required: [text]
      properties:
        label:
          type: string
        text:
          type: string
    QuestionGroup:
      type: object
      required: [id, type, instruction, questions]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/QuestionType"
        instruction:
          type: string
        maxWords:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
    Question:
      type: object
      required: [id, number, prompt, options, acceptedAnswers]
      properties:
        id:
          type: string
        number:
          type: integer
        prompt:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/ChoiceOption"
        acceptedAnswers:
          type: array
          items:
            type: string
        explanation:
          $ref: "#/components/schemas/Explanation"
    Explanation:
      type: object
      required: [text, paraphrases]
      properties:
        text:
          type: string
          description: Why the answer is correct, in Vietnamese
        evidence:
          oneOf:
            - $ref: "#/components/schemas/PassageEvidence"
            - $ref: "#/components/schemas/TranscriptEvidence"
          discriminator:
            propertyName: type
            mapping:
              passage: "#/components/schemas/PassageEvidence"
              transcript: "#/components/schemas/TranscriptEvidence"
        paraphrases:
          type: array
          items:
            $ref: "#/components/schemas/Paraphrase"
        trap:
          type: string
          description: The distractor learners usually pick, in Vietnamese
    PassageEvidence:
      type: object
      required: [type, paragraphId, quote]
      properties:
        type:
          type: string
          enum: [passage]
        paragraphId:
          type: string
          description: Label of the paragraph in the question's passage
        quote:
          type: string
          description: Verbatim English quote from the paragraph
    TranscriptEvidence:
      type: object
      required: [type, sectionNumber, startSeconds, endSeconds, quote]
      properties:
        type:
          type: string
          enum: [transcript]
        sectionNumber:
          type: integer
        startSeconds:
          type: integer
        endSeconds:
          type: integer
        quote:
          type: string
          description: Verbatim English quote from the transcript in this time range
    Paraphrase:
      type: object
      required: [inQuestion, inSource]
      properties:
        inQuestion:
          type: string
        inSource:
          type: string
    ChoiceOption:
      type: object
      required: [key, text]
      properties:
        key:
          type: string
        text:
          type: string
    SubmitAnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          description: Answer per question id
          additionalProperties:
            type: string
    ReadingResult:
      type: object
      required: [testId, correctCount, totalQuestions, band, questionResults]
      properties:
        testId:
          type: string
        correctCount:
          type: integer
        totalQuestions:
          type: integer
        band:
          type: number
          format: double
        questionResults:
          type: array
          items:
            $ref: "#/components/schemas/QuestionResult"
    ListeningTestSummary:
      type: object
      required: [id, title, durationSeconds, questionCount]
      properties:
        id:
          type: string
        title:
          type: string
        durationSeconds:
          type: integer
        questionCount:
          type: integer
    ListeningTest:
      type: object
      required: [id, schemaVersion, title, sections]
      properties:
        id:
          type: string
        schemaVersion:
          type: integer
        title:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ListeningSection"
    ListeningSection:
      type: object
      required: [id, number, title, audioUrl, durationSeconds, transcript, questionGroups]
      properties:
        id:
          type: string
        number:
          type: integer
        title:
          type: string
        audioUrl:
          type: string
          format: uri
          description: >-
            Absolute URL of the section audio: resolved against AUDIO_BASE_URL for public tests; for private tests
            a short-lived presigned R2 URL or the authenticated local streaming endpoint
        durationSeconds:
          type: integer
        transcript:
          type: array
          description: Empty when the section has no transcript
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        questionGroups:
          type: array
          items:
            $ref: "#/components/schemas/QuestionGroup"
    TranscriptSegment:
      type: object
      required: [startSeconds, endSeconds, text]
      properties:
        startSeconds:
          type: integer
        endSeconds:
          type: integer
        speaker:
          type: string
        text:
          type: string
    ListeningResult:
      type: object
      required: [testId, correctCount, totalQuestions, band, questionResults]
      properties:
        testId:
          type: string
        correctCount:
          type: integer
        totalQuestions:
          type: integer
        band:
          type: number
          format: double
        questionResults:
          type: array
          items:
            $ref: "#/components/schemas/QuestionResult"
    QuestionResult:
      type: object
      required: [questionId, number, isCorrect, acceptedAnswers]
      properties:
        questionId:
          type: string
        number:
          type: integer
        userAnswer:
          type: string
        isCorrect:
          type: boolean
        acceptedAnswers:
          type: array
          items:
            type: string
        explanation:
          $ref: "#/components/schemas/Explanation"
    SubmitAttemptRequest:
      type: object
      required: [clientId, testId, answers, createdAt]
      properties:
        clientId:
          type: string
          maxLength: 64
          description: Id generated by the app; reposting the same id returns the stored attempt
        testId:
          type: string
        answers:
          type: object
          description: Answer per question id of the test
          additionalProperties:
            type: string
            maxLength: 200
        createdAt:
          type: string
          format: date-time
    Attempt:
      type: object
      required: [id, clientId, testId, correctCount, totalQuestions, band, answers, createdAt, syncedAt]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
        testId:
          type: string
        correctCount:
          type: integer
        totalQuestions:
          type: integer
        band:
          type: number
          format: double
        answers:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        syncedAt:
          type: string
          format: date-time
          description: When the server stored the attempt
    AttemptPage:
      type: object
      required: [attempts]
      properties:
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
        nextCursor:
          type: string
          description: Present when older attempts remain; pass it as cursor to read them
    WritingTask:
      type: string
      enum: [task_1_academic, task_1_general, task_2]
    WritingPrompt:
      type: object
      required: [id, schemaVersion, module, task, instructions, minWords, timeLimitMinutes]
      properties:
        id:
          type: string
        schemaVersion:
          type: integer
        module:
          $ref: "#/components/schemas/IeltsModule"
        task:
          $ref: "#/components/schemas/WritingTask"
        instructions:
          type: string
        imageUrl:
          type: string
          format: uri
          description: >-
            Absolute URL of the chart or diagram, when the task has one: resolved against AUDIO_BASE_URL for public
            prompts; for private prompts a short-lived presigned R2 URL or the authenticated local image endpoint
        minWords:
          type: integer
        timeLimitMinutes:
          type: integer
    SubmitWritingRequest:
      type: object
      required: [promptId, text]
      properties:
        promptId:
          type: string
        text:
          type: string
          minLength: 1
          maxLength: 20000
    WritingSubmissionStatus:
      type: string
      enum: [pending, grading, graded, failed]
    WritingSubmission:
      type: object
      required: [id, promptId, text, wordCount, submittedAt, status]
      properties:
        id:
          type: string
          format: uuid
        promptId:
          type: string
        text:
          type: string
        wordCount:
          type: integer
          description: >-
            Counted on the server the IELTS way: numbers and hyphenated words are one word, punctuation alone is none
        submittedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/WritingSubmissionStatus"
