<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nghe kỹ — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
.light {
  --primary: #4B44C8; --on-primary: #FFFFFF; --primary-container: #E4E2FF; --on-primary-container: #16105A;
  --secondary: #515771; --on-secondary: #FFFFFF; --secondary-container: #DFE2F2; --on-secondary-container: #151A2E;
  --tertiary: #A3306B; --on-tertiary: #FFFFFF; --tertiary-container: #FFD8E7; --on-tertiary-container: #3D0022;
  --correct: #006B5E; --on-correct: #FFFFFF; --correct-container: #C2F0E7; --on-correct-container: #00201B;
  --wrong: #A52E17; --on-wrong: #FFFFFF; --wrong-container: #FFDBD1; --on-wrong-container: #3D0700;
  --warning: #844F00; --on-warning: #FFFFFF; --warning-container: #FFDDB5; --on-warning-container: #2B1700;
  --info: #005E9F; --on-info: #FFFFFF; --info-container: #D3E4FF; --on-info-container: #001C38;
  --surface: #F4F4F7; --card: #FFFFFF; --surface-low: #FAFAFC; --surface-container: #EDEDF1;
  --surface-high: #E7E7EC; --surface-highest: #E1E1E7; --surface-bright: #FAFAFC;
  --on-surface: #18181D; --on-surface-variant: #55555F; --outline: #81818C; --outline-variant: #D3D3DA;
  --inverse-surface: #2C2C33; --inverse-on-surface: #F0F0F4; --inverse-primary: #BDB8FF;
  --bar: rgba(244, 244, 247, 0.78); --scrim: rgba(0, 0, 0, 0.32);
  --shadow-card: 0 1px 2px #0000000A, 0 4px 16px #0000000F;
  --shadow-raised: 0 2px 6px #0000000F, 0 12px 32px #0000001A;
  --shadow-sheet: 0 -4px 24px #00000014;
  --shimmer: rgba(255, 255, 255, 0.55);
  color-scheme: light;
}
.dark {
  --primary: #BDB8FF; --on-primary: #221A84; --primary-container: #342CA6; --on-primary-container: #E4E2FF;
  --secondary: #BCC2DE; --on-secondary: #262C42; --secondary-container: #3C4259; --on-secondary-container: #DFE2F2;
  --tertiary: #FFB0D2; --on-tertiary: #600038; --tertiary-container: #841650; --on-tertiary-container: #FFD8E7;
  --correct: #5ADACB; --on-correct: #003730; --correct-container: #005046; --on-correct-container: #C2F0E7;
  --wrong: #FF8E6B; --on-wrong: #611300; --wrong-container: #7D1B06; --on-wrong-container: #FFDBD1;
  --warning: #FFB960; --on-warning: #482900; --warning-container: #673D00; --on-warning-container: #FFDDB5;
  --info: #A2C9FF; --on-info: #003259; --info-container: #00487D; --on-info-container: #D3E4FF;
  --surface: #0B0B0E; --card: #1B1B20; --surface-low: #141418; --surface-container: #1B1B20;
  --surface-high: #25252B; --surface-highest: #303037; --surface-bright: #303037;
  --on-surface: #E1E1E7; --on-surface-variant: #B4B4BF; --outline: #8A8A96; --outline-variant: #3A3A42;
  --inverse-surface: #E1E1E7; --inverse-on-surface: #2C2C33; --inverse-primary: #4B44C8;
  --bar: rgba(11, 11, 14, 0.72); --scrim: rgba(0, 0, 0, 0.48);
  --shadow-card: none;
  --shadow-raised: 0 12px 32px #00000066;
  --shadow-sheet: none;
  --shimmer: rgba(255, 255, 255, 0.06);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: #E4E4EA; color: #18181D; min-height: 100vh; }
button, input { font: inherit; color: inherit; background: none; border: 0; }
button, [role="button"] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
  display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; flex: none;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; }
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.ms.sm { font-size: 20px; } .ms.lg { font-size: 28px; } .ms.xl { font-size: 36px; }

.toolbar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  padding: 12px 20px; background: rgba(250, 250, 252, 0.85); backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid #D3D3DA; font-size: 13px; }
.tb-title { display: flex; flex-direction: column; margin-right: auto; max-width: 520px; }
.tb-title strong { font-size: 15px; } .tb-title span { color: #55555F; font-size: 12px; }
.tb-title a { color: #4B44C8; }
.tb-group { display: flex; flex-wrap: wrap; align-items: center; background: #E7E7EC; border-radius: 10px; padding: 2px; }
.tb-group > span { padding: 0 8px; color: #55555F; font-size: 12px; }
.tb-group button { padding: 6px 10px; border-radius: 8px; font-size: 13px; color: #55555F; font-weight: 500; }
.tb-group button[aria-pressed="true"] { background: #FFFFFF; color: #18181D; box-shadow: 0 1px 2px #0000001A; }
.tb-toggle { display: flex; gap: 6px; align-items: center; }
.tb-btn { padding: 7px 12px; border-radius: 10px; background: #4B44C8; color: #FFFFFF; font-weight: 600; font-size: 13px; }
.haptic-log { min-width: 190px; font-size: 12px; color: #55555F; display: flex; gap: 6px; align-items: center; }
.stage { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start; padding: 32px 20px 80px; }
.cell { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.cell-label { font-size: 13px; color: #55555F; font-weight: 500; }
.scaler { position: relative; }
.scaler > .device { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

.device { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: var(--surface); color: var(--on-surface);
  overflow: hidden; position: relative; -webkit-font-smoothing: antialiased; isolation: isolate; }
.device.phone { width: 390px; height: 844px; border-radius: 54px;
  box-shadow: 0 0 0 10px #0E0E10, 0 0 0 11px #3A3A42, 0 30px 60px -10px #00000055; }
.device.desktop { width: 1280px; height: 800px; border-radius: 12px; box-shadow: 0 0 0 1px #00000026, 0 30px 80px -20px #00000066; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 50px; padding: 16px 32px 0; display: flex;
  justify-content: space-between; font-size: 16px; font-weight: 600; z-index: 60; pointer-events: none; }
.status .icons { display: flex; gap: 4px; } .status .ms { font-size: 18px; }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px;
  background: var(--on-surface); z-index: 80; pointer-events: none; }
.win-bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--surface-low);
  border-bottom: 1px solid var(--outline-variant); position: relative; z-index: 60; }
.win-bar i { width: 12px; height: 12px; border-radius: 999px; background: var(--outline-variant); }
.win-bar span { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--on-surface-variant); pointer-events: none; }
.win-body { position: absolute; top: 38px; left: 0; right: 0; bottom: 0; display: flex; }

.t-display { font-size: 56px; line-height: 64px; font-weight: 700; letter-spacing: -0.5px; }
.t-large-title { font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.4px; }
.t-title1 { font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -0.3px; }
.t-title2 { font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -0.2px; }
.t-title3 { font-size: 19px; line-height: 26px; font-weight: 600; letter-spacing: -0.1px; }
.t-headline { font-size: 17px; line-height: 24px; font-weight: 600; }
.t-body { font-size: 17px; line-height: 26px; }
.t-reading { font-size: 18px; line-height: 30px; }
.t-callout { font-size: 16px; line-height: 24px; }
.t-subheadline { font-size: 15px; line-height: 22px; }
.t-label { font-size: 15px; line-height: 20px; font-weight: 600; }
.t-footnote { font-size: 13px; line-height: 18px; }
.t-caption { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.2px; }
.t-caption2 { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.3px; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--on-surface-variant); }
.grow { flex: 1; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.device :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 24px;
  border-radius: 14px; font-size: 17px; line-height: 24px; font-weight: 600; position: relative; user-select: none;
  transition: transform 100ms cubic-bezier(0.2, 0, 0, 1); white-space: nowrap; }
.btn::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0;
  transition: opacity 100ms; pointer-events: none; }
.btn:hover::after { opacity: 0.08; } .btn:active::after { opacity: 0.12; }
.btn::before, .hit::before { content: ''; position: absolute; left: 0; right: 0; top: min(0px, calc(50% - 24px)); bottom: min(0px, calc(50% - 24px)); }
.btn:active { transform: scale(0.97); }
.reduce .btn:active { transform: none; }
.desktop .btn { height: 44px; font-size: 15px; padding: 0 20px; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-secondary { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn-text { height: 48px; padding: 0 12px; color: var(--primary); font-size: 15px; font-weight: 600; }
.desktop .btn-text { height: 36px; }
.btn-small { height: 36px !important; padding: 0 14px !important; font-size: 15px !important; border-radius: 10px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.38; pointer-events: none; }
.icon-btn { width: 48px; height: 48px; border-radius: 999px; display: grid; place-items: center; position: relative; flex: none; color: var(--on-surface); }
.icon-btn:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.icon-btn:active { background: color-mix(in srgb, var(--on-surface) 12%, transparent); }
.icon-btn.selected { color: var(--on-primary-container); background: var(--primary-container); }
.icon-btn[disabled] { opacity: 0.38; pointer-events: none; }
.icon-btn .t-label { font-variant-numeric: tabular-nums; }
kbd { font: inherit; font-weight: 600; font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--surface-container);
  border: 1px solid var(--outline-variant); color: var(--on-surface); }

.tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px;
  line-height: 16px; font-weight: 500; letter-spacing: 0.2px; background: var(--surface-high); color: var(--on-surface-variant); white-space: nowrap; }
.tag.info { background: var(--info-container); color: var(--on-info-container); }
.tag.primary { background: var(--primary-container); color: var(--on-primary-container); }
.tag .ms { font-size: 16px; margin-left: -2px; }
.chip { height: 36px; padding: 0 14px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; position: relative;
  background: var(--card); box-shadow: inset 0 0 0 1px var(--outline); font-size: 15px; font-weight: 600; white-space: nowrap; flex: none;
  transition: background-color 150ms, box-shadow 150ms, color 150ms; }
.chip::before { content: ''; position: absolute; left: 0; right: 0; top: -6px; bottom: -6px; }
.chip:hover { background: color-mix(in srgb, var(--on-surface) 6%, var(--card)); }
.chip[aria-pressed="true"], .chip.on { background: var(--primary-container); color: var(--on-primary-container); box-shadow: inset 0 0 0 2px var(--primary); }
.chip .ms { font-size: 18px; margin-left: -4px; }
.chip .x { margin: 0 -8px 0 2px; }
.banner { display: flex; gap: 12px; align-items: center; padding: 10px 8px 10px 14px; border-radius: 14px;
  background: var(--info-container); color: var(--on-info-container); }
.banner .ms { color: var(--info); }
.banner.warning { background: var(--warning-container); color: var(--on-warning-container); }
.banner.warning .ms { color: var(--warning); }
.banner .btn-text { color: var(--on-info-container); text-decoration: underline; text-underline-offset: 3px; }
.skel { background: var(--surface-high); border-radius: 8px; position: relative; overflow: hidden; }
.skel::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--shimmer), transparent); animation: shimmer 1.2s cubic-bezier(0.2, 0, 0, 1) infinite; }
.reduce .skel::after { animation: none; display: none; }
@keyframes shimmer { to { transform: translateX(100%); } }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 32px 24px; }
.empty .btn { margin-top: 12px; }
.error-icon { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; margin-bottom: 8px;
  background: var(--wrong-container); color: var(--on-wrong-container); }
.i0 { fill: var(--card); stroke: var(--on-surface); stroke-opacity: 0.7; stroke-width: 2; stroke-linejoin: round; }
.i1 { fill: var(--primary-container); } .i2 { fill: var(--primary); } .i3 { fill: var(--tertiary-container); }
.is { fill: none; stroke: var(--on-surface); stroke-opacity: 0.7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 14px; background: var(--surface-high); }
.seg button { position: relative; z-index: 1; height: 36px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--on-surface-variant); transition: color 150ms; }
.seg button[aria-checked="true"] { color: var(--on-surface); }
.seg .ind { position: absolute; top: 4px; left: 4px; height: 36px; border-radius: 10px; background: var(--surface-bright); box-shadow: var(--shadow-card); transition: transform var(--snappy); }
.dark .seg .ind { box-shadow: none; }
.reduce .seg .ind { transition: none; }
.switch { width: 52px; height: 32px; border-radius: 999px; position: relative; flex: none; background: var(--surface-highest); box-shadow: inset 0 0 0 2px var(--outline); transition: background-color 150ms, box-shadow 150ms; }
.switch::after { content: ''; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 999px; background: var(--outline); transition: transform var(--snappy), background-color 150ms, width var(--snappy), height var(--snappy), top var(--snappy); }
.switch[aria-checked="true"] { background: var(--primary); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--on-primary); width: 24px; height: 24px; top: 4px; left: 4px; }
.slider { position: relative; height: 48px; touch-action: none; }
.slider .track { position: absolute; left: 12px; right: 12px; top: 22px; height: 4px; border-radius: 999px; background: var(--surface-high); }
.slider .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--primary); }
.slider .stop { position: absolute; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 999px; background: var(--on-surface-variant); }
.slider .thumb { position: absolute; top: 12px; width: 24px; height: 24px; margin-left: -12px; border-radius: 999px; background: var(--surface-bright); box-shadow: var(--shadow-raised); border: 1px solid var(--outline-variant); }
.slider-labels { display: flex; justify-content: space-between; padding: 0 4px; }

.ls-shell { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surface); }
.phone .ls-shell { padding-top: 50px; }
.ls-top { flex: none; height: 56px; display: flex; align-items: center; gap: 0; padding: 0 4px; }
.ls-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.ls-sub { flex: none; padding: 4px 20px 8px; display: flex; flex-direction: column; gap: 12px; }
.chip-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 6px 20px; }
.chip-row::-webkit-scrollbar { display: none; }
.ls-main { flex: 1; min-height: 0; position: relative; }
.transcript { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.transcript::-webkit-scrollbar { display: none; }
.t-inner { position: relative; padding: 8px 20px 260px; }
.desktop .t-inner { max-width: 728px; margin: 0 auto; padding: 24px 24px 64px; }
.sent { position: relative; display: block; padding: 12px 16px 12px 20px; margin: 0 -12px; border-radius: 20px; color: var(--on-surface-variant);
  transition: background-color 250ms, box-shadow 250ms, color 250ms; outline-offset: -2px; }
.sent + .sent { margin-top: 2px; }
.sent:hover { background: color-mix(in srgb, var(--on-surface) 4%, transparent); }
.sent.current { background: var(--card); box-shadow: var(--shadow-card); color: var(--on-surface); }
.dark .sent.current { background: var(--surface-container); box-shadow: inset 0 0 0 1px var(--outline-variant); }
.dark .sent.evidence { background: var(--info-container); box-shadow: none; }
.sent-head { display: flex; align-items: center; gap: 8px; min-height: 0; }
.sent-head:not(:empty) { margin-bottom: 4px; }
.sent-head .spk { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.2px; color: var(--on-surface-variant); }
.sent-head .time { margin-left: auto; font-size: 12px; color: var(--on-surface-variant); opacity: 0; transition: opacity 150ms; }
.desktop .sent:hover .time, .desktop .sent.current .time { opacity: 1; }
.sent-head .tags { display: flex; gap: 6px; margin-left: auto; }
.sent-head .time + .tags { margin-left: 8px; }
.txt { position: relative; font-size: 18px; line-height: 30px; }
.txt .w { position: relative; z-index: 1; transition: color 150ms; border-radius: 6px; }
.sent.current .w { color: var(--on-surface-variant); }
.sent.current .w.spoken { color: var(--on-surface); }
.sent.current .w.now { color: var(--on-primary-container); }
.pill { position: absolute; left: 0; top: 0; height: 28px; border-radius: 7px; background: var(--primary-container); z-index: 0; opacity: 0;
  transition: transform var(--snappy), width var(--snappy), opacity 150ms; pointer-events: none; }
.reduce .pill { transition: opacity 150ms; }
.vi { margin-top: 4px; font-size: 16px; line-height: 24px; color: var(--on-surface-variant); }
.sent.evidence { background: var(--info-container); color: var(--on-info-container); box-shadow: none; }
.sent.evidence.current .w, .sent.evidence.current .w.spoken { color: var(--on-info-container); }
.sent.evidence .vi { color: var(--on-info-container); opacity: 0.85; }
.w.answer { box-shadow: 0 2px 0 var(--info); border-radius: 0; }
.hidden-mode .sent:not(.revealed) .w { color: transparent !important; background: var(--surface-high); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.hidden-mode .sent.current:not(.revealed) .w.spoken, .hidden-mode .sent.current:not(.revealed) .w.now { background: var(--primary-container); }
.hidden-mode .sent:not(.revealed) .pill { display: none; }
.hidden-mode .sent:not(.revealed) .vi { display: none; }
.reveal-btn { display: none; }
.hidden-mode .sent:not(.revealed) .reveal-btn { display: inline-flex; }
.bracket { position: absolute; left: 10px; width: 3px; border-radius: 3px; background: var(--primary); z-index: 3; pointer-events: none; transform-origin: 50% 50%; }
.bracket .h { position: absolute; left: 50%; width: 48px; height: 48px; margin-left: -24px; display: grid; place-items: center; pointer-events: auto; cursor: ns-resize; touch-action: none; }
.bracket .h::after { content: ''; width: 14px; height: 14px; border-radius: 999px; background: var(--primary); box-shadow: 0 0 0 3px var(--surface); }
.bracket .h.top { top: -24px; } .bracket .h.bottom { bottom: -24px; }
.coach { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 24px 0 0; color: var(--on-surface-variant); }
.end-card { margin-top: 24px; padding: 20px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow-card); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dark .end-card { background: var(--surface-container); }
.end-card .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
.follow-pill { position: absolute; left: 50%; z-index: 25; transform: translateX(-50%); height: 40px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
  background: var(--inverse-surface); color: var(--inverse-on-surface); font-size: 15px; font-weight: 600; box-shadow: var(--shadow-raised); }
.phone .follow-pill { bottom: 206px; }
.desktop .follow-pill { bottom: 16px; }

.pb { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); }
.phone .pb { border-radius: 28px 28px 0 0; box-shadow: var(--shadow-sheet), inset 0 1px 0 var(--outline-variant); padding: 0 16px 34px; touch-action: none; }
.desktop .pb { position: relative; flex: none; border-top: 1px solid var(--outline-variant); padding: 10px 24px 8px; height: 112px; }

const STAGGER = 30;
