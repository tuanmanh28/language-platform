<body>
<header class="toolbar">
  <div class="tb-title"><strong>Chép chính tả (dictation)</strong><span>Mockup · <a href="../README.md">spec</a> · bộ chấm từng từ chạy thật: gõ vào ô (hoặc bàn phím ảo trên điện thoại) rồi Kiểm tra. Máy tính: Enter, ⌘/Ctrl R nghe lại, ⌥ Space / Ctrl Space chậm, ⌘/Ctrl G gợi ý</span></div>
  <div class="tb-group" data-control="theme"><span>Giao diện</span><button data-value="light">Sáng</button><button data-value="dark">Tối</button><button data-value="both">Cả hai</button></div>
  <div class="tb-group" data-control="frame"><span>Khung</span><button data-value="phone">Điện thoại</button><button data-value="desktop">Máy tính</button><button data-value="both">Cả hai</button></div>
  <div class="tb-group" data-control="state"><span>Trạng thái</span></div>
  <label class="tb-toggle"><input type="checkbox" id="reduce"> Giảm chuyển động</label>
  <button class="tb-btn" id="replay">Phát lại</button>
  <div class="haptic-log" aria-live="polite"></div>
</header>
<main class="stage" id="stage"></main>
<script>
const SPRINGS = { snappy: [0.30, 0.88], smooth: [0.40, 1], bouncy: [0.45, 0.72], gentle: [0.60, 1] };
const DURATION = { instant: 100, short: 150, medium: 250, long: 400, extraLong: 700 };
const EASING = { standard: 'cubic-bezier(0.2, 0, 0, 1)', decelerate: 'cubic-bezier(0.05, 0.7, 0.1, 1)', accelerate: 'cubic-bezier(0.3, 0, 0.8, 0.15)' };
const STAGGER = 30;
const STATES = [['setup', 'Thiết lập'], ['resume', 'Làm tiếp'], ['typing', 'Đang gõ'], ['hint', 'Dùng gợi ý'], ['ime', 'Bộ gõ tiếng Việt'], ['checked', 'Có lỗi'],
  ['perfect', 'Đúng hết'], ['cloze', 'Từ khoá'], ['summary', 'Tổng kết'], ['loading', 'Đang tải'], ['error', 'Lỗi âm thanh'], ['unavailable', 'Chưa chia câu']];
const ui = { theme: 'light', frame: 'both', state: 'typing' };

const TEST_NAME = 'Listening Test 1 (mẫu)';
const SENTENCES = [
  ['Helen', 'Good morning, everyone, and welcome to the Riverside Community Garden.', 'Chào buổi sáng mọi người, chào mừng đến với Vườn cộng đồng Riverside.'],
  ['Helen', 'My name’s Helen, and I’ve been volunteering here for about six years.', 'Tôi là Helen, tôi làm tình nguyện viên ở đây khoảng sáu năm rồi.'],
  ['Helen', 'Before we start the tour, let me tell you a little about how the garden began.', 'Trước khi đi tham quan, để tôi kể một chút về việc khu vườn ra đời thế nào.'],
  ['Helen', 'It was set up in 2009 on land that used to be a car park behind the old library.', 'Khu vườn được lập năm 2009 trên mảnh đất từng là bãi đỗ xe phía sau thư viện cũ.'],
  ['Helen', 'At first, there were only twelve plots, but today we have more than eighty.', 'Lúc đầu chỉ có mười hai ô đất, nhưng giờ chúng tôi có hơn tám mươi ô.'],
  ['Helen', 'Most of them are rented by local families, although a few are kept for the primary school.', 'Phần lớn do các gia đình quanh đây thuê, dù vài ô được giữ cho trường tiểu học.'],
  ['Helen', 'If you’d like a plot of your own, the waiting list is currently around eight months.', 'Nếu bạn muốn có một ô riêng, danh sách chờ hiện khoảng tám tháng.'],
  ['Helen', 'Plots cost forty pounds a year, and that includes water and the use of all our tools.', 'Mỗi ô giá bốn mươi bảng một năm, đã gồm tiền nước và được dùng mọi dụng cụ.'],
  ['Helen', 'The tool shed is just to your left, next to the compost bins.', 'Kho dụng cụ ở ngay bên trái bạn, cạnh các thùng ủ phân.'],
  ['Helen', 'Please remember to sign the book whenever you borrow anything.', 'Nhớ ký vào sổ mỗi khi bạn mượn bất cứ thứ gì nhé.'],
  ['Helen', 'Now, if you follow me past the greenhouse, we’ll visit the herb garden first.', 'Giờ mời mọi người theo tôi đi qua nhà kính, ta sẽ ghé vườn thảo mộc trước.'],
].map(([speaker, text, vi], index) => ({ index, speaker, text, vi, duration: 1.2 + text.length * 0.052 }));
const SEED = [
  { score: 1, missed: [] }, { score: 1, missed: [] }, { score: 0.94, missed: [['little', 'litter']] },
  { score: 0.89, missed: [['2009', '2019'], ['park', '—']] }, { score: 0.93, missed: [['plots', 'plot']] }, { score: 0.88, missed: [['although', 'all though']] },
  { score: 0.94, missed: [['currently', 'current']] },
];
const SUMMARY_TAIL = [
  { score: 0.76, missed: [['forty', 'fourteen'], ['includes', 'include'], ['tools', 'tool']] }, { score: 1, missed: [] },
  { score: 0.9, missed: [['whenever', 'when ever']] }, { score: 0.86, missed: [['greenhouse', 'green house']] },
];
const RETRY_BELOW = 0.9;
const PRESETS = {
  typing: 'Plots cost forty pounds a year, and that',
  hint: 'Plots cost forty pounds a year and that ',
  ime: 'Plots cost fỏty',
  checked: 'Plots cost fourteen pounds a year and that include water and use of all our tool',
  perfect: 'Plots cost 40 pounds a year and that includes water and the use of all our tools',
};
const CLOZE_GAPS = [2, 3, 9, 16];
const EQUIVALENT = [['forty', '40'], ['eight', '8'], ['twelve', '12'], ['eighty', '80'], ['six', '6'], ['colour', 'color'], ['centre', 'center'], ['programme', 'program'], ['car-park', 'carpark']];
const VI_DIACRITICS = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;

const deviceState = new WeakMap();
let reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const normalise = (word) => word.toLowerCase().replace(/[’‘]/g, "'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, '');
const tokens = (text) => text.split(/\s+/).filter((w) => normalise(w));
function same(a, b) {
  const x = normalise(a), y = normalise(b);
  return x === y || EQUIVALENT.some(([p, q]) => (x === p && y === q) || (x === q && y === p));
}

function check(expectedText, typedText, hints = new Map()) {
  const exp = tokens(expectedText), typ = tokens(typedText);
  const n = exp.length, m = typ.length;
  const lcs = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) lcs[i][j] = same(exp[i], typ[j]) ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
  const ops = [];
  let i = 0, j = 0, missing = [], extra = [];
  const flush = () => {
    const pairs = Math.min(missing.length, extra.length);
    for (let k = 0; k < pairs; k++) ops.push({ kind: 'bad', word: exp[missing[k]], typed: typ[extra[k]], index: missing[k] });
    missing.slice(pairs).forEach((x) => ops.push({ kind: 'miss', word: exp[x], index: x }));
    extra.slice(pairs).forEach((y) => ops.push({ kind: 'extra', typed: typ[y] }));
    missing = []; extra = [];
  };
  while (i < n || j < m) {
    if (i < n && j < m && same(exp[i], typ[j])) {
      flush();
      const accepted = normalise(exp[i]) !== normalise(typ[j]);
      ops.push({ kind: hints.has(i) ? 'hinted' : 'ok', word: exp[i], typed: typ[j], index: i, accepted, hint: hints.get(i) });
      i++; j++;
    } else if (j >= m || (i < n && lcs[i + 1][j] >= lcs[i][j + 1])) { missing.push(i); i++; }
    else { extra.push(j); j++; }
  }
  flush();
  let earned = 0;
  ops.forEach((op) => {
    if (op.kind === 'ok') earned += 1;
    if (op.kind === 'hinted') earned += op.hint === 'letter' ? 0.5 : 0;
    if (op.kind === 'extra') earned -= 0.5;
  });
  const correct = ops.filter((op) => op.kind === 'ok' || op.kind === 'hinted').length;
  return { ops, correct, total: n, score: Math.max(0, earned) / n };
}

function diffHTML(result) {
  return result.ops.map((op, k) => {
    const d = `style="--k:${k}"`;
    if (op.kind === 'ok') return op.accepted
      ? `<span class="tok ok accepted" ${d} title="Chấp nhận: ${normalise(op.typed)} = ${normalise(op.word)}">${op.word}<small>(${normalise(op.typed)})</small><span class="sr">, đúng, chấp nhận ${normalise(op.typed)}</span></span>`
      : `<span class="tok ok" ${d}>${op.word}<span class="sr">, đúng</span></span>`;
    if (op.kind === 'hinted') return `<span class="tok hinted" ${d}>${op.word}<span class="ms" aria-hidden="true">lightbulb</span><span class="sr">, dùng gợi ý</span></span>`;
    if (op.kind === 'bad') return `<span class="tok bad" ${d}><s>${op.typed}</s><span class="fix">${normalise(op.word)}</span><span class="sr">, sai, đúng là ${normalise(op.word)}</span></span>`;
    if (op.kind === 'miss') return `<span class="tok miss" ${d}><span class="sr">thiếu: </span>${normalise(op.word)}</span>`;
    return `<span class="tok extra" ${d}><span class="sr">thừa: </span><s>${op.typed}</s></span>`;
  }).join(' ');
}

function tipFor(result) {
  const bad = result.ops.filter((op) => op.kind === 'bad');
  const number = bad.find((op) => /teen$/.test(normalise(op.typed)) && /ty$/.test(normalise(op.word)) || /ty$/.test(normalise(op.typed)) && /teen$/.test(normalise(op.word)));
  if (number) return `<b>${normalise(number.word)}</b> và <b>${normalise(number.typed)}</b> dễ nghe nhầm: số đuôi <i>-ty</i> nhấn âm đầu, số đuôi <i>-teen</i> nhấn âm sau.`;
  const plural = bad.filter((op) => normalise(op.word) === `${normalise(op.typed)}s`);
  if (plural.length) return `Chú ý đuôi <i>-s</i>: ${plural.map((op) => `<b>${normalise(op.word)}</b>`).join(', ')} — âm cuối rất nhẹ, nghe chậm để bắt được.`;
  return '';
}

function message(score) {
  if (score >= 0.999) return 'Chính xác hoàn toàn';
  if (score >= 0.8) return 'Rất tốt — chỉ sót vài từ.';
  if (score >= 0.5) return 'Gần đúng rồi — nghe lại những từ còn sai nhé.';
  return 'Câu này khó — nghe chậm rồi thử lại nhé.';
}

const pct = (x) => `${Math.round(x * 100)}%`;
const fmtSpeed = (v) => `${Number(v.toFixed(2)).toString().replace('.', ',')}×`;

function createState(state) {
  const index = 7;
  const st = { state, index, results: SEED.slice(0, index).map((r) => ({ ...r })), typed: PRESETS[state] || '', hints: new Map(), slow: false, plays: 2,
    playing: false, progress: 0, checked: null, streak: 0, mode: state === 'cloze' ? 'cloze' : 'full', gaps: {}, busy: false };
  if (state === 'hint') st.hints.set(8, 'letter');
  if (state === 'hint') st.typed += 'i';
  if (state === 'checked' || state === 'perfect') st.checked = check(SENTENCES[index].text, st.typed, st.hints);
  if (state === 'perfect') st.streak = 2;
  if (state === 'summary') st.results = [...SEED, ...SUMMARY_TAIL].map((r) => ({ ...r }));
  return st;
}

function ring(size, stroke, fraction) {
  const radius = (size - stroke) / 2;
  const length = 2 * Math.PI * radius;
  const offset = length * (1 - fraction);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="track" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${stroke}"/>
    <circle class="fill" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${stroke}" stroke-dasharray="${length}" stroke-dashoffset="${offset}" data-length="${length}" data-offset="${offset}"/></svg>`;
}

function roller(text) {
  const parts = [...String(text)].map((ch) => (/\d/.test(ch)
    ? `<span class="digit" aria-hidden="true"><span class="digits" data-digit="${ch}">${'0123456789'.split('').map((d) => `<span>${d}</span>`).join('')}</span></span>`
    : `<span aria-hidden="true">${ch}</span>`));
  return `<span class="roller tnum">${parts.join('')}<span class="sr">${text}</span></span>`;
}

function waveBars(index, count) {
  return Array.from({ length: count }, (_, i) => {
    const t = i / count;
    const n = Math.abs(Math.sin((i + index * 31) * 12.9898) * 43758.5453) % 1;
    const edge = Math.min(1, t * 8, (1 - t) * 8);
    return `<i style="height:${Math.round((0.2 + (0.3 + 0.5 * n) * edge) * 100)}%"></i>`;
  }).join('');
}

function playButton(st, frame) {
  const circumference = 2 * Math.PI * 40;
  return `<button class="play" data-action="play" aria-label="${st.playing ? 'Tạm dừng' : `Phát câu ${st.index + 1}`}">
    <svg viewBox="0 0 84 84" aria-hidden="true"><circle class="track" cx="42" cy="42" r="40"/><circle class="prog" cx="42" cy="42" r="40" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference * (1 - st.progress)}"/></svg>
    <span class="ms fill">${st.playing ? 'pause' : 'play_arrow'}</span></button>`;
}

function audioCard(st, frame, compact) {
  const s = SENTENCES[st.index];
  const mod = frame === 'desktop' ? '⌘' : '';
  const tools = `<button class="tool" data-action="replay" aria-label="Nghe lại (${mod ? '⌘R' : 'Ctrl R'})"><span class="ms sm">replay</span>Nghe lại${frame === 'desktop' ? ' <kbd>⌘R</kbd>' : ''}</button>
    <button class="tool" data-action="slow" aria-pressed="${st.slow}" aria-label="Chậm 0,75 lần"><span class="ms sm">slow_motion_video</span>Chậm 0,75×${frame === 'desktop' ? ' <kbd>⌥Space</kbd>' : ''}</button>`;
  if (st.state === 'error') {
    return `<div class="audio-card" role="alert"><div class="error-icon" style="width:56px;height:56px;margin:0"><span class="ms">volume_off</span></div><div class="audio-main"><span class="t-headline">Chưa phát được câu này</span><span class="t-footnote muted">Kiểm tra kết nối rồi thử lại. Bạn vẫn gõ được nếu đã nghe.</span></div><button class="btn btn-secondary btn-small" data-action="retry">Thử lại</button></div>`;
  }
  return `<div class="audio-card ${compact ? 'compact' : ''}">${playButton(st, frame)}
    <div class="audio-main"><div style="display:flex;align-items:center;gap:8px"><span class="t-label">Câu ${st.index + 1} · ${s.speaker}</span><span class="grow"></span><span class="t-footnote muted plays tnum">Đã nghe ${st.plays} lần</span></div>
      <div class="wave"><div class="bars">${waveBars(st.index, compact ? 52 : frame === 'desktop' ? 120 : 60)}</div><div class="bars played">${waveBars(st.index, compact ? 52 : frame === 'desktop' ? 120 : 60)}</div></div>
      ${compact ? '' : `<div class="audio-actions">${tools}</div>`}</div></div>`;
}

function hintInfo(st) {
  const used = st.hints.size;
  if (!used) return '';
  const total = tokens(SENTENCES[st.index].text).length;
  const max = [...st.hints.values()].reduce((acc, h) => acc - (h === 'letter' ? 0.5 : 1), total) / total;
  return `<p class="hint-line t-footnote"><span class="ms sm">lightbulb</span>Đã dùng ${used} gợi ý · câu này tối đa ${pct(max)}</p>`;
}

function nextHintLabel(st) {
  const index = tokens(st.typed.slice(0, st.typed.length)).length - (/\S$/.test(st.typed) ? 1 : 0);
  return st.hints.get(index) === 'letter' ? 'Gợi ý cả từ' : 'Gợi ý chữ cái';
}

function fieldBlock(st, frame) {
  const ime = VI_DIACRITICS.test(st.typed);
  const imeBanner = `<div class="banner warning ime" role="status" ${ime ? '' : 'hidden'}><span class="ms">keyboard</span><span class="t-footnote grow">Hình như bộ gõ tiếng Việt đang bật. Chuyển sang bàn phím tiếng Anh để gõ chính xác hơn.</span></div>`;
  if (st.mode === 'cloze') {
    const words = SENTENCES[st.index].text.split(' ');
    const html = words.map((w, i) => (CLOZE_GAPS.includes(i) ? `<input class="gap" data-gap="${i}" aria-label="Từ còn thiếu số ${CLOZE_GAPS.indexOf(i) + 1}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${st.gaps[i] || ''}">${/[.,]$/.test(w) ? w.slice(-1) : ''}` : w)).join(' ');
    return `<div class="field-wrap"><div class="field-label"><span class="t-label">Điền ${CLOZE_GAPS.length} từ còn thiếu</span><span class="grow"></span><span class="t-footnote muted">${frame === 'desktop' ? 'Tab để sang ô tiếp' : ''}</span></div><div class="cloze" lang="en">${html}</div></div>${imeBanner}`;
  }
  return `${imeBanner}<div class="field-wrap"><div class="field-label" aria-hidden="true"><span class="t-label">Gõ những gì bạn nghe</span></div>
    <textarea class="field" lang="en" aria-label="Câu ${st.index + 1}, gõ những gì bạn nghe" placeholder="Gõ những gì bạn nghe được…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">${st.typed}</textarea>
    ${hintInfo(st)}</div>`;
}

function resultBlock(st, frame) {
  const s = SENTENCES[st.index];
  const r = st.checked;
  const perfect = r.score >= 0.999;
  const tip = tipFor(r);
  const missed = r.ops.filter((op) => op.kind === 'bad' || op.kind === 'miss').map((op) => normalise(op.word)).filter((w, i, a) => a.indexOf(w) === i && w.length > 3);
  const streak = perfect && st.streak >= 3 ? '<p class="t-footnote" style="color:var(--correct)">3 câu đúng liền mạch</p>' : '';
  return `<div class="field-wrap result" role="status" aria-live="polite">
    <div class="result-head"><div class="score ${perfect ? 'perfect' : ''}">${perfect ? '<span class="ms check">check</span>' : roller(pct(r.score))}</div>
      <div class="grow"><div class="t-headline">${message(r.score)}</div><div class="t-footnote muted tnum">${r.correct}/${r.total} từ · ${pct(r.score)}</div>${streak}</div></div>
    <div class="diff" lang="en">${diffHTML(r)}</div>
    ${tip ? `<div class="tip t-footnote"><span class="ms sm">tips_and_updates</span><span>${tip}</span></div>` : ''}
    <div class="answer-box"><div class="t-caption muted">CÂU ĐÚNG</div><p class="t-reading" lang="en">${s.text}</p><p class="t-callout muted" lang="vi" style="margin-top:4px">${s.vi}</p></div>
    ${missed.length ? `<div class="save-chips">${missed.map((w) => `<button class="chip save-word" data-word="${w}" aria-pressed="false"><span class="ms">bookmark_add</span>${w}</button>`).join('')}<button class="btn btn-text save-all" data-action="save-all">Lưu ${missed.length} từ vào thẻ</button></div>` : ''}
  </div>`;
}

function footer(st, frame) {
  if (st.checked) {
    const last = st.index === SENTENCES.length - 1;
    return frame === 'desktop'
      ? `<button class="btn btn-text" data-action="retry-sentence">Thử lại câu này</button><span class="grow"></span><button class="btn btn-primary next" data-action="next" data-autofocus>${last ? 'Xem tổng kết' : 'Câu tiếp'} <kbd>Enter</kbd></button>`
      : `<button class="btn btn-primary btn-block next" data-action="next">${last ? 'Xem tổng kết' : 'Câu tiếp'}</button><button class="btn btn-text" data-action="retry-sentence">Thử lại câu này</button>`;
  }
  const empty = st.mode === 'cloze' ? false : !st.typed.trim();
  if (frame === 'phone') return `<button class="btn btn-primary btn-block check-btn" data-action="check" ${empty ? 'disabled' : ''}>Kiểm tra</button>`;
  if (frame === 'desktop') {
    return `<button class="btn btn-secondary hint-btn" data-action="hint"><span class="ms sm">lightbulb</span><span class="hint-label">${nextHintLabel(st)}</span> <kbd>⌘G</kbd></button>
      <button class="btn btn-text" data-action="skip">Bỏ qua <kbd style="font-size:12px;opacity:.7">⌘⇧Enter</kbd></button><span class="grow"></span>
      <button class="btn btn-primary check-btn" data-action="check" ${empty ? 'disabled' : ''}>Kiểm tra <kbd>Enter</kbd></button>`;
  }
  return '';
}

function keyboardHTML(st) {
  const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  return `<div class="accessory" role="toolbar" aria-label="Điều khiển nghe">
      <button class="acc" data-action="play" aria-label="Phát câu"><span class="ms sm fill acc-play">${st.playing ? 'pause' : 'play_arrow'}</span></button>
      <button class="acc" data-action="replay"><span class="ms sm">replay</span>Nghe lại</button>
      <button class="acc" data-action="slow" aria-pressed="${st.slow}"><span class="ms sm">slow_motion_video</span>Chậm</button>
      <button class="acc hint-btn" data-action="hint" aria-label="Gợi ý"><span class="ms sm">lightbulb</span></button>
      <button class="acc primary check-btn" data-action="check" ${st.mode !== 'cloze' && !st.typed.trim() ? 'disabled' : ''}>Kiểm tra</button></div>
    <div class="keyboard" aria-hidden="true">${rows.map((row, i) => `<div class="krow">${i === 2 ? '<span class="key alt" data-key="shift">⇧</span>' : ''}${[...row].map((k) => `<span class="key" data-key="${k}">${k}</span>`).join('')}${i === 2 ? '<span class="key alt" data-key="back">⌫</span>' : ''}</div>`).join('')}
      <div class="krow"><span class="key alt" data-key="123">123</span><span class="key alt" data-key="'">’</span><span class="key space" data-key=" ">space</span><span class="key ret" data-key="return">Kiểm tra</span></div></div>`;
}

function barHTML(st, frame, { progress = true } = {}) {
  const done = st.index;
  const label = progress ? `<div class="d-progress" aria-label="Câu ${st.index + 1} trên ${SENTENCES.length}"><span class="t-label tnum">${st.index + 1}/${SENTENCES.length}</span><div class="pbar"><i style="width:${(done / SENTENCES.length) * 100}%"></i></div></div>` : '';
  const title = frame === 'desktop' ? `<div style="display:flex;flex-direction:column"><span class="t-headline">Chép chính tả</span><span class="t-caption muted">${TEST_NAME} · Section 2</span></div>` : '';
  return `<div class="d-bar"><button class="icon-btn" data-action="close" aria-label="Đóng (Esc)"><span class="ms">close</span></button>${title}${label}
    <div class="right">${progress ? `<button class="icon-btn" data-action="settings" aria-label="Tuỳ chọn"><span class="ms">tune</span></button>` : ''}</div></div>`;
}

function sessionHTML(st, frame) {
  const keyboardUp = frame === 'phone' && !st.checked && st.state !== 'error';
  if (st.state === 'loading') {
    return `${barHTML(st, frame)}<span class="sr" role="status">Đang chuẩn bị câu</span><div class="d-body"><div class="skel" style="height:${frame === 'desktop' ? 136 : 104}px;border-radius:20px"></div><div class="skel" style="height:180px;border-radius:20px"></div></div>`;
  }
  const body = st.checked ? resultBlock(st, frame) : fieldBlock(st, frame);
  const shortcuts = frame === 'desktop' ? `<div class="shortcuts"><span><kbd class="k">Enter</kbd> ${st.checked ? 'câu tiếp' : 'kiểm tra'}</span><span><kbd class="k">⌘R</kbd> nghe lại</span><span><kbd class="k">⌥Space</kbd> chậm (Windows: <kbd class="k">Ctrl Space</kbd>)</span><span><kbd class="k">⌘G</kbd> gợi ý</span><span><kbd class="k">⌘⇧Enter</kbd> bỏ qua</span><span><kbd class="k">Esc</kbd> thoát</span></div>` : '';
  return `${barHTML(st, frame)}<div class="d-body"><div class="swap">${audioCard(st, frame, keyboardUp)}</div><div class="swap body-slot">${body}</div></div>
    ${frame === 'desktop' || !keyboardUp ? `<div class="d-foot">${footer(st, frame)}</div>` : ''}${keyboardUp ? keyboardHTML(st) : ''}${shortcuts}`;
}

function summaryHTML(st, frame) {
  const results = st.results;
  const score = results.reduce((a, r) => a + r.score, 0) / results.length;
  const missed = results.flatMap((r, i) => r.missed.map(([word, typed]) => ({ word, typed, i }))).slice(-5);
  const retry = results.filter((r) => r.score < RETRY_BELOW).length;
  return `${barHTML(st, frame, { progress: false })}<div class="summary" role="status">
    <div class="summary-ring">${ring(168, 14, score)}<div class="center"><div><div class="t-display tnum">${roller(pct(score))}</div><div class="t-subheadline muted">chính xác</div></div></div></div>
    <h1 class="t-title1">Xong Section 2!</h1>
    <p class="t-callout muted">${results.length} câu · 14 phút · 2 gợi ý</p>
    <span class="delta tnum"><span class="ms xs">trending_up</span>+8% so với lần trước</span>
    <div class="block"><div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px"><h2 class="t-headline">Từ hay nghe sai</h2><button class="btn btn-text" data-action="save-all" style="height:36px">Lưu tất cả ${missed.length} từ</button></div>
      <div class="list">${missed.map(({ word, typed, i }) => `<div class="row"><div class="grow"><div class="t-headline" lang="en">${word}</div><div class="t-footnote muted">Câu ${i + 1} · bạn gõ: <span lang="en">${typed}</span></div></div>
        <button class="icon-btn" data-action="hear" aria-label="Nghe câu ${i + 1}"><span class="ms">volume_up</span></button><button class="icon-btn save-toggle" data-action="save-one" aria-pressed="false" aria-label="Lưu ${word} vào thẻ"><span class="ms">bookmark_add</span></button></div>`).join('')}</div></div>
    <div class="actions"><button class="btn btn-primary" data-action="again"><span class="ms">replay</span>Luyện lại ${retry} câu chưa đúng</button><button class="btn btn-text" data-action="close">Về Luyện đề</button></div></div>`;
}

const ILLO_NOTEBOOK = `<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
  <rect class="i3" x="30" y="24" width="64" height="80" rx="10" transform="rotate(6 62 64)"/>
  <rect class="i0" x="26" y="20" width="64" height="80" rx="10"/>
  <path class="is" d="M38 42 H76 M38 54 H70 M38 66 H62"/>
  <circle class="i1" cx="84" cy="84" r="16"/><path class="is" d="M78 84 h4 l4 -6 v12 l-4 -6" />
</svg>`;

function unavailableHTML(st, frame) {
  const size = frame === 'desktop' ? 160 : 120;
  return `${barHTML(st, frame, { progress: false })}<div class="empty" style="flex:1;justify-content:center">${ILLO_NOTEBOOK.replace('width="120" height="120"', `width="${size}" height="${size}"`)}
    <h2 class="t-title2" style="margin-top:8px">Bài này chưa được chia câu</h2><p class="t-callout muted" style="max-width:340px">Chép chính tả cần mốc thời gian của từng câu. Chọn một bài khác để luyện nhé.</p>
    <button class="btn btn-primary" data-action="close" style="margin-top:12px">Chọn bài khác</button></div>`;
}

function setupBaseHTML(frame) {
  return `<div class="base-screen">${frame === 'phone' ? '<div style="height:56px;display:flex;align-items:center;margin:0 -16px"><button class="icon-btn" aria-label="Quay lại"><span class="ms">arrow_back_ios_new</span></button></div>' : ''}
    <p class="t-caption muted">LISTENING · 4 SECTION · 40 CÂU</p><h1 class="t-large-title">${TEST_NAME}</h1>
    <div class="list" style="margin-top:20px">
      <button class="row"><span class="tile"><span class="ms">headphones</span></span><span class="grow"><span class="t-headline" style="display:block">Làm bài thi</span><span class="t-footnote muted">30 phút · như thi thật</span></span><span class="ms muted">chevron_right</span></button>
      <button class="row"><span class="tile"><span class="ms">hearing</span></span><span class="grow"><span class="t-headline" style="display:block">Nghe kỹ</span><span class="t-footnote muted">Từng câu, lặp đoạn, đổi tốc độ</span></span><span class="ms muted">chevron_right</span></button>
      <button class="row" data-action="open-setup"><span class="tile"><span class="ms">keyboard</span></span><span class="grow"><span class="t-headline" style="display:block">Chép chính tả</span><span class="t-footnote muted">Lần trước 78% · hôm qua</span></span><span class="ms muted">chevron_right</span></button></div></div>`;
}

function setupSheetHTML(st, resume) {
  const sections = [[1, 14], [2, 11], [3, 16], [4, 0]];
  const resumeCard = resume ? `<div class="resume"><div style="display:flex;align-items:center;gap:12px"><span class="ms">history</span><div class="grow"><div class="t-headline">Làm tiếp</div><div class="t-footnote tnum">Section 2 · câu 7/11 · 92% chính xác</div></div></div>
    <div class="pbar"><i style="width:${(6 / 11) * 100}%;background:var(--on-primary-container)"></i></div>
    <div style="display:flex;gap:8px"><button class="btn btn-primary start" data-action="start" data-autofocus style="flex:1">Làm tiếp</button><button class="btn btn-text" data-action="restart">Làm lại từ đầu</button></div></div>` : '';
  return `<div class="handle"></div><h2 class="t-title2">Chép chính tả</h2><p class="t-subheadline muted">${TEST_NAME}</p>${resumeCard}
    <div class="field-group"><span class="t-label">Section</span><div style="display:flex;flex-wrap:wrap;gap:8px">${sections.map(([n, c]) => `<button class="chip" data-pick="${n}" aria-pressed="${n === 2}" ${c ? '' : 'disabled'}>Section ${n} <small>${c ? `${c} câu` : 'Chưa chia câu'}</small></button>`).join('')}</div></div>
    <div class="field-group"><span class="t-label">Kiểu luyện</span><div class="seg" role="radiogroup" aria-label="Kiểu luyện" data-seg><button role="radio" aria-checked="true">Cả câu</button><button role="radio" aria-checked="false">Từ khoá</button><button role="radio" aria-checked="false" ${resume ? '' : 'disabled'} title="Làm ít nhất một lần để mở">Từ hay sai</button><span class="ind"></span></div>
      ${resume ? '' : '<p class="t-footnote muted">“Từ hay sai” mở sau lần luyện đầu tiên.</p>'}</div>
    <div class="field-group"><span class="t-label">Tốc độ bắt đầu</span><div style="display:flex;gap:8px">${[0.75, 0.85, 1].map((v) => `<button class="chip speed" aria-pressed="${v === 1}">${fmtSpeed(v)}</button>`).join('')}</div></div>
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px;margin-top:12px"><span class="t-label">Tự phát câu tiếp theo</span><button class="switch" role="switch" aria-checked="true" aria-label="Tự phát câu tiếp theo" data-switch></button></div>
    <button class="btn ${resume ? 'btn-secondary' : 'btn-primary'} btn-block start" data-action="${resume ? 'restart' : 'start'}" ${resume ? '' : 'data-autofocus'} style="margin-top:16px">Bắt đầu · <span class="pick-count">11</span> câu</button>`;
}

function screen(frame, st) {
  let inner;
  if (['setup', 'resume', 'detail'].includes(st.state)) inner = `<div class="layer base">${setupBaseHTML(frame)}</div>`;
  else if (st.state === 'summary') inner = `<div class="layer base">${summaryHTML(st, frame)}</div>`;
  else if (st.state === 'unavailable') inner = `<div class="layer base">${unavailableHTML(st, frame)}</div>`;
  else inner = `<div class="layer base session">${sessionHTML(st, frame)}</div>`;
  const shell = `<div class="nav-host">${inner}</div>`;
  return frame === 'phone'
    ? `<div class="status"><span>9:41</span><span class="icons"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span></div>${shell}<div class="home-ind"></div>`
    : `<div class="win-bar"><i></i><i></i><i></i><span>Luyện IELTS — Chép chính tả</span></div><div class="win-body">${shell}</div>`;
}

function renderSession(device, frame, st, { animate = null } = {}) {
  const layer = device.querySelector('.layer.base');
  layer.className = 'layer base session';
  const scroll = layer.querySelector('.d-body') ? layer.querySelector('.d-body').scrollTop : 0;
  layer.innerHTML = sessionHTML(st, frame);
  wireSession(device, frame, st);
  if (animate === 'none') layer.querySelector('.d-body').scrollTop = scroll;
  return layer;
}

function wireSession(device, frame, st) {
  const field = device.querySelector('.field');
  if (field) {
    field.addEventListener('input', () => onInput(device, frame, st));
    field.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.metaKey && !event.ctrlKey) { event.preventDefault(); event.stopPropagation(); doCheck(device, frame, st); }
    });
  }
  device.querySelectorAll('.gap').forEach((gap) => {
    gap.addEventListener('input', () => { st.gaps[gap.dataset.gap] = gap.value; onInput(device, frame, st); });
    gap.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); event.stopPropagation(); doCheck(device, frame, st); } });
  });
  device.querySelectorAll('.key').forEach((key) => key.addEventListener('pointerdown', (event) => { event.preventDefault(); typeKey(device, frame, st, key.dataset.key); }));
  device.querySelectorAll('.save-word').forEach((chip) => chip.addEventListener('click', () => {
    const on = chip.getAttribute('aria-pressed') !== 'true';
    chip.setAttribute('aria-pressed', String(on));
    chip.querySelector('.ms').textContent = on ? 'bookmark_added' : 'bookmark_add';
    if (on) haptic(device, 'impact light · SEGMENT_TICK');
  }));
}

function onInput(device, frame, st) {
  const field = device.querySelector('.field');
  if (field) st.typed = field.value;
  const banner = device.querySelector('.ime');
  const text = field ? st.typed : Object.values(st.gaps).join(' ');
  const ime = VI_DIACRITICS.test(text);
  if (banner && banner.hidden === ime) {
    banner.hidden = !ime;
    if (ime) play(banner, [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], 'smooth');
  }
  device.querySelectorAll('.check-btn').forEach((b) => { b.disabled = st.mode !== 'cloze' && !st.typed.trim(); });
  device.querySelectorAll('.hint-label').forEach((l) => { l.textContent = nextHintLabel(st); });
}

function typeKey(device, frame, st, key) {
  if (key === 'return') return doCheck(device, frame, st);
  const active = document.activeElement;
  const field = device.querySelector('.field') || (active && active.classList.contains('gap') && device.contains(active) ? active : device.querySelector('.gap:not([readonly])'));
  if (!field || field.readOnly || ['shift', '123'].includes(key)) return;
  if (key === 'back') field.value = field.value.slice(0, -1);
  else field.value += key;
  if (field.classList.contains('gap')) st.gaps[field.dataset.gap] = field.value;
  onInput(device, frame, st);
}

function giveHint(device, frame, st) {
  if (st.checked || st.mode === 'cloze') return;
  const field = device.querySelector('.field');
  const expected = tokens(SENTENCES[st.index].text);
  const caret = field.selectionStart ?? field.value.length;
  const before = field.value.slice(0, caret);
  const partial = before.match(/\S*$/)[0];
  const index = tokens(before).length - (partial ? 1 : 0);
  const target = expected[index];
  if (!target) return;
  const word = normalise(target);
  const level = st.hints.get(index) === 'letter' || (partial && !word.startsWith(normalise(partial))) ? 'word' : 'letter';
  const insert = level === 'letter' ? (partial ? word.slice(0, partial.length + 1) : word[0]) : `${word} `;
  const start = caret - partial.length;
  field.value = field.value.slice(0, start) + insert + field.value.slice(caret);
  field.focus();
  field.selectionStart = field.selectionEnd = start + insert.length;
  st.hints.set(index, level);
  st.typed = field.value;
  const wrap = field.closest('.field-wrap');
  const old = wrap.querySelector('.hint-line');
  if (old) old.remove();
  wrap.insertAdjacentHTML('beforeend', hintInfo(st));
  play(wrap.querySelector('.hint-line'), [{ opacity: 0 }, { opacity: 1 }], { duration: DURATION.short, easing: EASING.standard });
  play(field, [{ boxShadow: 'inset 0 0 0 2px var(--info)' }, { boxShadow: 'inset 0 0 0 2px var(--primary)' }], { duration: DURATION.medium, easing: EASING.standard });
  onInput(device, frame, st);
}

function doCheck(device, frame, st) {
  if (st.busy) return;
  if (st.checked) return next(device, frame, st);
  if (st.mode === 'cloze') return checkCloze(device, frame, st);
  if (!st.typed.trim()) return;
  st.checked = check(SENTENCES[st.index].text, st.typed, st.hints);
  const perfect = st.checked.score >= 0.999;
  st.streak = perfect ? st.streak + 1 : 0;
  haptic(device, st.streak >= 3 ? 'success · CONFIRM' : 'impact medium · CONFIRM');
  const layer = renderSession(device, frame, st);
  revealResult(layer);
  const nextBtn = layer.querySelector('.next');
  if (nextBtn) nextBtn.focus({ preventScroll: true });
}

function checkCloze(device, frame, st) {
  const words = SENTENCES[st.index].text.split(' ');
  const ops = [];
  device.querySelectorAll('.gap').forEach((gap, k) => {
    const i = Number(gap.dataset.gap);
    const ok = same(words[i], gap.value);
    gap.classList.add(ok ? 'ok' : 'bad');
    gap.readOnly = true;
    gap.setAttribute('aria-label', ok ? `${normalise(words[i])}, đúng` : `${gap.value || 'bỏ trống'}, sai, đúng là ${normalise(words[i])}`);
    if (!ok) gap.insertAdjacentHTML('afterend', `<span class="gap-fix">${normalise(words[i])}</span>`);
    ops.push({ kind: ok ? 'ok' : 'bad', word: words[i], typed: gap.value || '—' });
    play(gap, [{ transform: 'scale(0.96)' }, { transform: 'none' }], ok ? 'bouncy' : 'smooth', { delay: k * STAGGER });
  });
  const correct = ops.filter((op) => op.kind === 'ok').length;
  st.checked = { ops, correct, total: ops.length, score: correct / ops.length };
  const label = device.querySelector('.field-label .t-label');
  if (label) label.textContent = `Đúng ${correct}/${ops.length} từ`;
  device.querySelectorAll('.check-btn').forEach((b) => { b.firstChild.textContent = 'Câu tiếp '; });
  haptic(device, 'impact medium · CONFIRM');
}

function revealResult(layer) {
  const result = layer.querySelector('.result');
  if (!result) return;
  play(result, [{ opacity: 0 }, { opacity: 1 }], { duration: DURATION.medium, easing: EASING.standard });
  const toks = [...result.querySelectorAll('.tok')];
  toks.forEach((tok, k) => play(tok, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], 'smooth', { delay: 80 + Math.min(k, 8) * STAGGER }));
  result.querySelectorAll('.tok.bad s').forEach((s) => play(s, [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], 'smooth', { delay: 200, fallback: [{ opacity: 1 }, { opacity: 1 }] }));
  result.querySelectorAll('.roller').forEach(roll);
  const check = result.querySelector('.check');
  if (check) play(check, [{ transform: 'scale(0.6)', opacity: 0 }, { transform: 'none', opacity: 1 }], 'bouncy', { delay: 80, fallback: [{ opacity: 0 }, { opacity: 1 }] });
  layer.querySelectorAll('.d-foot').forEach((foot) => play(foot, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], 'smooth', { delay: 120 }));
}

async function next(device, frame, st) {
  if (st.busy) return;
  st.busy = true;
  st.results.push({ score: st.checked ? st.checked.score : 0, missed: st.checked ? st.checked.ops.filter((op) => op.kind === 'bad' || op.kind === 'miss').map((op) => [normalise(op.word), op.typed || '—']) : [] });
  if (st.index >= SENTENCES.length - 1) {
    st.busy = false;
    return showSummary(device, frame, st);
  }
  const slots = [...device.querySelectorAll('.swap, .d-foot')];
  await Promise.all(slots.map((el) => play(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-24px)' }], { duration: 90, easing: EASING.accelerate })));
  st.index += 1;
  st.typed = '';
  st.hints = new Map();
  st.checked = null;
  st.plays = 0;
  st.gaps = {};
  st.state = 'typing';
  const layer = renderSession(device, frame, st);
  layer.querySelectorAll('.swap, .d-foot').forEach((el) => play(el, [{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], 'snappy'));
  const fill = layer.querySelector('.d-progress .pbar > i');
  if (fill) play(fill, [{ transform: `scaleX(${(st.index - 1) / st.index})` }, { transform: 'none' }], 'gentle');
  const field = layer.querySelector('.field');
  if (field) field.focus({ preventScroll: true });
  st.busy = false;
  startAudio(device, st);
}

function showSummary(device, frame, st) {
  const host = device.querySelector('.nav-host');
  const base = host.querySelector('.layer.base');
  const page = document.createElement('div');
  page.className = 'layer page';
  page.style.zIndex = 10;
  page.innerHTML = summaryHTML(st, frame);
  host.append(page);
  play(page, [{ transform: 'translateX(100%)' }, { transform: 'none' }], 'smooth', { fallback: [{ opacity: 0 }, { opacity: 1 }] });
  play(base, [{ transform: 'none' }, { transform: 'translateX(-30%)' }], 'smooth');
  enterSummary(page);
  haptic(device, 'success · CONFIRM');
}

function enterSummary(root) {
  root.querySelectorAll('.ring .fill').forEach((circle) => play(circle, [{ strokeDashoffset: Number(circle.dataset.length) }, { strokeDashoffset: circle.dataset.offset }], 'gentle', { delay: 120 }));
  root.querySelectorAll('.roller').forEach(roll);
  root.querySelectorAll('.list .row, .delta').forEach((el, i) => play(el, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], 'smooth', { delay: 200 + Math.min(i, 8) * STAGGER }));
}

function roll(el) {
  el.querySelectorAll('.digits').forEach((col, i) => {
    const target = `translateY(-${Number(col.dataset.digit) * 1.2}em)`;
    col.style.transform = target;
    play(col, [{ transform: 'translateY(0)' }, { transform: target }], 'gentle', { delay: 150 + i * 40 });
  });
}

function startAudio(device, st) {
  if (st.state === 'error') return;
  st.playing = true;
  st.progress = 0;
  st.plays += 1;
  st.startedAt = performance.now();
  updateAudio(device, st);
}

function updateAudio(device, st) {
  device.querySelectorAll('.play .ms, .acc-play').forEach((icon) => { icon.textContent = st.playing ? 'pause' : 'play_arrow'; });
  device.querySelectorAll('.play').forEach((b) => b.setAttribute('aria-label', st.playing ? 'Tạm dừng' : `Phát câu ${st.index + 1}`));
  device.querySelectorAll('.plays').forEach((p) => { p.textContent = `Đã nghe ${st.plays} lần`; });
}

function audioTick(device, st, now) {
  if (!st.playing) return;
  const duration = (SENTENCES[st.index].duration / (st.slow ? 0.75 : 1)) * 1000;
  st.progress = Math.min(1, (now - st.startedAt) / duration);
  const circumference = 2 * Math.PI * 40;
  device.querySelectorAll('.play .prog').forEach((c) => { c.style.strokeDashoffset = circumference * (1 - st.progress); });
  device.querySelectorAll('.wave .bars.played').forEach((b) => { b.style.clipPath = `inset(0 ${(1 - st.progress) * 100}% 0 0)`; });
  if (st.progress >= 1) { st.playing = false; updateAudio(device, st); }
}

const live = new Set();
function loop(now) {
  live.forEach((device) => { if (!device.isConnected) return live.delete(device); audioTick(device, deviceState.get(device), now); });
  requestAnimationFrame(loop);
}

function openSetup(device, frame, st, resume) {
  const ctrl = openSheet(device, frame, setupSheetHTML(st, resume), 'Chép chính tả');
  const sheet = ctrl.sheet;
  positionIndicators(sheet);
  sheet.querySelectorAll('[data-pick]').forEach((chip) => chip.addEventListener('click', () => {
    chip.setAttribute('aria-pressed', String(chip.getAttribute('aria-pressed') !== 'true'));
    const counts = { 1: 14, 2: 11, 3: 16 };
    const total = [...sheet.querySelectorAll('[data-pick][aria-pressed="true"]')].reduce((a, c) => a + counts[c.dataset.pick], 0);
    sheet.querySelectorAll('.pick-count').forEach((el) => { el.textContent = total; });
    sheet.querySelectorAll('.start').forEach((b) => { b.disabled = total === 0; });
    haptic(device, 'selection · CLOCK_TICK');
  }));
  sheet.querySelectorAll('.chip.speed').forEach((chip) => chip.addEventListener('click', () => { sheet.querySelectorAll('.chip.speed').forEach((c) => c.setAttribute('aria-pressed', String(c === chip))); haptic(device, 'selection · CLOCK_TICK'); }));
  sheet.querySelector('[data-seg]').addEventListener('click', (event) => {
    const b = event.target.closest('button');
    if (!b) return;
    sheet.querySelectorAll('[data-seg] button').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
    positionIndicators(sheet);
    haptic(device, 'selection · CLOCK_TICK');
  });
  sheet.querySelector('[data-switch]').addEventListener('click', (event) => { const s = event.currentTarget; s.setAttribute('aria-checked', String(s.getAttribute('aria-checked') !== 'true')); });
  sheet.querySelectorAll('[data-action="start"], [data-action="restart"]').forEach((button) => button.addEventListener('click', (event) => {
    event.stopPropagation();
    const mode = sheet.querySelectorAll('[data-seg] button')[1].getAttribute('aria-checked') === 'true' ? 'cloze' : 'full';
    startSession(device, frame, st, button, ctrl, { restart: !resume || button.dataset.action === 'restart', mode });
  }));
}

function startSession(device, frame, st, button, ctrl, { restart, mode }) {
  const from = localRect(device, button);
  const full = frame === 'phone' ? { x: 0, y: 0, w: 390, h: 844 } : { x: 0, y: 38, w: 1280, h: 762 };
  if (restart) { st.index = 0; st.results = []; } else { st.index = 6; st.results = SEED.slice(0, 6).map((r) => ({ ...r })); }
  st.state = 'typing'; st.typed = ''; st.hints = new Map(); st.checked = null; st.plays = 0; st.mode = mode; st.gaps = {};
  const morph = document.createElement('div');
  morph.className = 'morph';
  morph.innerHTML = `<div class="layer session" style="position:absolute;left:${-full.x}px;top:0;width:${full.w}px;height:${full.h}px">${sessionHTML(st, frame)}</div>`;
  if (frame === 'desktop') { morph.style.top = '38px'; }
  device.append(morph);
  haptic(device, 'impact light · CONTEXT_CLICK');
  ctrl.sheet.parentElement.querySelector('.scrim').style.transition = 'opacity 150ms';
  const finish = () => {
    ctrl.sheet.parentElement.remove();
    morph.remove();
    renderSession(device, frame, st);
    const field = device.querySelector('.field, .gap');
    if (field) field.focus({ preventScroll: true });
    startAudio(device, st);
  };
  if (reduceMotion) { play(morph, [{ opacity: 0 }, { opacity: 1 }]).then(finish); return; }
  const clip = (r, radius) => `inset(${r.y - full.y}px ${full.x + full.w - r.x - r.w}px ${full.y + full.h - r.y - r.h}px ${r.x - full.x}px round ${radius}px)`;
  const content = morph.querySelector('.layer');
  play(content, [{ opacity: 0 }, { opacity: 0, offset: 0.3 }, { opacity: 1, offset: 0.7 }, { opacity: 1 }], 'smooth');
  play(ctrl.sheet, [{ opacity: 1 }, { opacity: 0 }], { duration: DURATION.short, easing: EASING.standard });
  const tone = (name) => getComputedStyle(device).getPropertyValue(name).trim();
  play(morph, [{ clipPath: clip(from, 14), backgroundColor: tone('--primary') }, { clipPath: clip(full, frame === 'phone' ? 54 : 0), backgroundColor: tone('--surface') }], 'smooth').then(finish);
}

function openExit(device, frame, st) {
  const typed = st.typed.trim();
  if (!typed && !st.checked) { ui.state = 'resume'; syncControls(); return render(); }
  const ctrl = openSheet(device, frame, `<div class="handle"></div><h2 class="t-title2">Lưu và thoát?</h2><p class="t-callout muted" style="margin-top:8px">Bạn làm tiếp được từ câu ${st.index + 1} bất cứ lúc nào.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:24px"><button class="btn btn-primary" data-action="stay" data-autofocus>Ở lại</button><button class="btn btn-text" data-action="leave">Lưu và thoát</button></div>`, 'Lưu và thoát?');
  ctrl.sheet.querySelector('[data-action="stay"]').addEventListener('click', (event) => { event.stopPropagation(); ctrl.close(); });
  ctrl.sheet.querySelector('[data-action="leave"]').addEventListener('click', (event) => { event.stopPropagation(); ctrl.close(); ui.state = 'resume'; syncControls(); render(); });
}

function mount(device, frame) {
  const st = createState(ui.state);
  deviceState.set(device, st);
  live.add(device);
  if (['typing', 'hint', 'ime', 'checked', 'perfect', 'cloze', 'error'].includes(st.state)) wireSession(device, frame, st);
  device.addEventListener('click', (event) => {
    const target = event.target.closest('button');
    if (!target || !device.contains(target) || target.closest('.sheet')) return;
    const action = target.dataset.action;
    if (action === 'open-setup') return openSetup(device, frame, st, false);
    if (action === 'play') { if (st.playing) { st.playing = false; updateAudio(device, st); } else startAudio(device, st); return haptic(device, 'selection · CLOCK_TICK'); }
    if (action === 'replay') { startAudio(device, st); return haptic(device, 'selection · CLOCK_TICK'); }
    if (action === 'slow') return toggleSlow(device, st);
    if (action === 'hint') return giveHint(device, frame, st);
    if (action === 'check') return doCheck(device, frame, st);
    if (action === 'next') return next(device, frame, st);
    if (action === 'skip') { st.checked = check(SENTENCES[st.index].text, '', new Map()); const layer = renderSession(device, frame, st); layer.querySelector('.result .t-headline').textContent = 'Đã bỏ qua · câu này sẽ có trong phần luyện lại'; revealResult(layer); return; }
    if (action === 'retry-sentence') { st.checked = null; st.typed = ''; st.hints = new Map(); renderSession(device, frame, st); const f = device.querySelector('.field'); if (f) f.focus(); startAudio(device, st); return; }
    if (action === 'close') {
      if (st.state === 'summary' || st.state === 'unavailable' || device.querySelector('.layer.page')) { ui.state = 'detail'; syncControls(); return render(); }
      return openExit(device, frame, st);
    }
    if (action === 'save-all') { device.querySelectorAll('.save-word, .save-toggle').forEach((c) => { c.setAttribute('aria-pressed', 'true'); c.querySelector('.ms').textContent = 'bookmark_added'; }); haptic(device, 'impact light · SEGMENT_TICK'); return snackbar(device, 'Đã lưu vào thẻ, kèm câu và đoạn âm thanh'); }
    if (action === 'save-one') { const on = target.getAttribute('aria-pressed') !== 'true'; target.setAttribute('aria-pressed', String(on)); target.querySelector('.ms').textContent = on ? 'bookmark_added' : 'bookmark_add'; if (on) haptic(device, 'impact light · SEGMENT_TICK'); return; }
    if (action === 'again') { ui.state = 'typing'; syncControls(); return render(); }
    if (action === 'retry') { ui.state = 'loading'; syncControls(); render(); setTimeout(() => { ui.state = 'typing'; syncControls(); render(); }, 1400); }
  });
  if (st.state === 'setup' || st.state === 'resume') openSetup(device, frame, st, st.state === 'resume');
  if (st.state === 'summary') enterSummary(device);
  if (['checked', 'perfect'].includes(st.state)) revealResult(device.querySelector('.layer.base'));
  if (st.state === 'typing') startAudio(device, st);
  if (st.state === 'loading') setTimeout(() => { if (!device.isConnected) return; st.state = 'typing'; const layer = renderSession(device, frame, st); play(layer.querySelector('.d-body'), [{ opacity: 0 }, { opacity: 1 }], { duration: DURATION.short, easing: EASING.standard }); startAudio(device, st); }, 1800);
}

function toggleSlow(device, st) {
  st.slow = !st.slow;
  device.querySelectorAll('[data-action="slow"]').forEach((b) => b.setAttribute('aria-pressed', String(st.slow)));
  haptic(device, 'selection · CLOCK_TICK');
  startAudio(device, st);
}

function snackbar(device, text) {
  device.querySelectorAll('.snackbar').forEach((s) => s.remove());
  const bar = document.createElement('div');
  bar.className = 'snackbar';
  bar.setAttribute('role', 'status');
  bar.innerHTML = `<span class="t-subheadline grow">${text}</span><button class="btn btn-text">Xem thẻ</button>`;
  device.querySelector('.nav-host').append(bar);
  play(bar, [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], 'smooth');
  setTimeout(() => { if (bar.isConnected) play(bar, [{ opacity: 1 }, { opacity: 0 }], { duration: DURATION.short, easing: EASING.standard }).then(() => bar.remove()); }, 4000);
}

function handleKey(event) {
  const device = event.target.closest && event.target.closest('.device.desktop');
  const targets = device ? [device] : [...document.querySelectorAll('.device.desktop')];
  const mod = event.metaKey || event.ctrlKey;
  targets.forEach((d) => {
    const st = deviceState.get(d);
    if (!st || !d.querySelector('.session') || d.querySelector('.sheet-layer')) return;
    if (mod && event.key.toLowerCase() === 'r') { event.preventDefault(); startAudio(d, st); }
    else if ((event.altKey && event.code === 'Space') || (event.ctrlKey && event.code === 'Space')) { event.preventDefault(); toggleSlow(d, st); }
    else if (mod && event.key.toLowerCase() === 'g') { event.preventDefault(); giveHint(d, 'desktop', st); }
    else if (mod && event.shiftKey && event.key === 'Enter') { event.preventDefault(); d.querySelector('[data-action="skip"]')?.click(); }
    else if (event.key === 'Enter' && st.checked && !event.target.closest('button')) { event.preventDefault(); next(d, 'desktop', st); }
    else if (event.key === 'Escape') openExit(d, 'desktop', st);
  });
}

function positionIndicators(root) {
  root.querySelectorAll('.seg').forEach((seg) => {
    const buttons = [...seg.querySelectorAll('button')];
    const index = Math.max(0, buttons.findIndex((b) => b.getAttribute('aria-checked') === 'true'));
    const ind = seg.querySelector('.ind');
    ind.style.width = `${buttons[index].offsetWidth}px`;
    ind.style.transform = `translateX(${buttons[index].offsetLeft - 4}px)`;
  });
}

const springCache = new Map();
function springTiming(name) {
  if (springCache.has(name)) return springCache.get(name);
  const [response, damping] = SPRINGS[name];
  const omega = (2 * Math.PI) / response;
  const values = [];
  let x = 0, v = 0, settle = 0;
  for (let step = 0; step < 3000; step++) {
    v += (-omega * omega * (x - 1) - 2 * damping * omega * v) / 1000;
    x += v / 1000;
    values.push(x);
    if (Math.abs(x - 1) > 0.001 || Math.abs(v) > 0.01) settle = step + 1;
  }
  const count = Math.max(settle, 100);
  const points = Array.from({ length: 61 }, (_, i) => (i === 0 ? 0 : i === 60 ? 1 : values[Math.round((i / 60) * count) - 1]));
  const timing = { duration: count, easing: `linear(${points.map((p) => p.toFixed(4)).join(', ')})` };
  springCache.set(name, timing);
  return timing;
}
document.documentElement.style.setProperty('--snappy', `${springTiming('snappy').duration}ms ${springTiming('snappy').easing}`);

function play(el, keyframes, motion = 'smooth', options = {}) {
  if (!el) return Promise.resolve();
  const { fallback, ...extra } = options;
  let frames = keyframes, timing = typeof motion === 'string' ? springTiming(motion) : motion;
  if (reduceMotion) {
    frames = fallback || keyframes.map(({ transform, ...rest }) => rest);
    timing = frames.some((f) => 'opacity' in f) ? { duration: DURATION.short, easing: EASING.standard } : { duration: 0 };
  }
  const animation = el.animate(frames, { ...timing, fill: 'both', ...extra });
  return animation.finished.then(() => {
    if (!el.isConnected) return;
    try { animation.commitStyles(); } catch (e) { }
    animation.cancel();
  }).catch(() => { });
}

function haptic(device, kind) {
  if (device.classList.contains('desktop')) return;
  const log = document.querySelector('.haptic-log');
  log.innerHTML = `<span class="ms sm">vibration</span> Rung: ${kind}`;
  log.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DURATION.short });
  clearTimeout(haptic.timer);
  haptic.timer = setTimeout(() => { log.textContent = ''; }, 2000);
}

function localRect(device, el) {
  const scale = Number(device.dataset.scale);
  const d = device.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: (r.left - d.left) / scale, y: (r.top - d.top) / scale, w: r.width / scale, h: r.height / scale };
}

function openSheet(device, frame, html, label, { dismissible = true, onClose = () => { } } = {}) {
  const opener = document.activeElement;
  const layer = document.createElement('div');
  layer.className = 'sheet-layer';
  layer.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}">${html}</div>`;
  device.append(layer);
  const sheet = layer.querySelector('.sheet'), scrim = layer.querySelector('.scrim');
  const phone = frame === 'phone';
  play(scrim, [{ opacity: 0 }, { opacity: 1 }], 'smooth');
  play(sheet, phone ? [{ transform: 'translateY(100%)' }, { transform: 'none' }] : [{ opacity: 0, transform: 'scale(0.96)' }, { opacity: 1, transform: 'none' }], 'smooth', { fallback: [{ opacity: 0 }, { opacity: 1 }] });
  const initial = sheet.querySelector('[data-autofocus]') || sheet.querySelector('h2');
  if (!initial.matches('button')) initial.setAttribute('tabindex', '-1');
  initial.focus({ preventScroll: true });
  const close = (fromY = 0) => {
    onClose();
    play(scrim, [{ opacity: Math.max(0, 1 - fromY / sheet.offsetHeight) }, { opacity: 0 }], 'smooth');
    play(sheet, phone ? [{ transform: `translateY(${fromY}px)` }, { transform: 'translateY(100%)' }] : [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(0.96)' }], 'smooth', { fallback: [{ opacity: 1 }, { opacity: 0 }] }).then(() => {
      layer.remove();
      if (opener && opener.isConnected) opener.focus({ preventScroll: true });
    });
  };
  layer.addEventListener('keydown', (event) => {
    event.stopPropagation();
    if (event.key === 'Escape' && dismissible) return close();
    if (event.key !== 'Tab') return;
    const focusable = [...sheet.querySelectorAll('button:not([disabled]), input, [tabindex="0"]')];
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && (document.activeElement === first || !sheet.contains(document.activeElement))) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  if (dismissible) scrim.addEventListener('click', () => close());
  const api = { sheet, close };
  if (!phone || !dismissible) return api;
  let startY = null, lastY = 0, lastT = 0, velocity = 0;
  const scale = Number(device.dataset.scale);
  sheet.addEventListener('pointerdown', (event) => {
    if (event.target.closest('button')) return;
    startY = event.clientY; lastY = event.clientY; lastT = event.timeStamp;
    sheet.setPointerCapture(event.pointerId);
    sheet.getAnimations().forEach((a) => a.cancel());
  });
  sheet.addEventListener('pointermove', (event) => {
    if (startY === null) return;
    const dy = Math.max(0, (event.clientY - startY) / scale);
    velocity = (event.clientY - lastY) / scale / Math.max(1, event.timeStamp - lastT);
    lastY = event.clientY; lastT = event.timeStamp;
    sheet.style.transform = `translateY(${dy}px)`;
    scrim.style.opacity = 1 - dy / sheet.offsetHeight;
  });
  sheet.addEventListener('pointerup', (event) => {
    if (startY === null) return;
    const dy = Math.max(0, (event.clientY - startY) / scale);
    startY = null;
    if (dy > sheet.offsetHeight * 0.3 || velocity > 0.6) return close(dy);
    play(sheet, [{ transform: `translateY(${dy}px)` }, { transform: 'none' }], 'smooth');
    play(scrim, [{ opacity: 1 - dy / sheet.offsetHeight }, { opacity: 1 }], 'smooth');
  });
  return api;
}

const FRAME_NAMES = { phone: 'Điện thoại 390 × 844', desktop: 'Máy tính 1280 × 800' };
const THEME_NAMES = { light: 'Sáng', dark: 'Tối' };

function fit(scaler, device, frame) {
  const width = frame === 'phone' ? 390 : 1280, height = frame === 'phone' ? 844 : 800;
  const scale = Math.min(1, (window.innerWidth - 64) / width);
  scaler.style.width = `${width * scale}px`;
  scaler.style.height = `${height * scale}px`;
  device.style.transform = `scale(${scale})`;
  device.dataset.scale = scale;
}

function render() {
  const stage = document.getElementById('stage');
  const themes = ui.theme === 'both' ? ['light', 'dark'] : [ui.theme];
  const frames = ui.frame === 'both' ? ['phone', 'desktop'] : [ui.frame];
  live.clear();
  stage.innerHTML = '';
  for (const frame of frames) {
    for (const theme of themes) {
      const cell = document.createElement('section');
      cell.className = 'cell';
      cell.innerHTML = `<div class="cell-label">${FRAME_NAMES[frame]} · ${THEME_NAMES[theme]}</div><div class="scaler"><div class="device ${frame} ${theme}${reduceMotion ? ' reduce' : ''}">${screen(frame, createState(ui.state))}</div></div>`;
      stage.append(cell);
      const device = cell.querySelector('.device');
      fit(cell.querySelector('.scaler'), device, frame);
      mount(device, frame);
    }
  }
}

function syncControls() {
  document.querySelectorAll('.tb-group[data-control]').forEach((group) => {
    group.querySelectorAll('button').forEach((button) => button.setAttribute('aria-pressed', String(ui[group.dataset.control] === button.dataset.value)));
  });
}

function setupControls() {
  const stateGroup = document.querySelector('[data-control="state"]');
  stateGroup.insertAdjacentHTML('beforeend', STATES.map(([value, label]) => `<button data-value="${value}">${label}</button>`).join(''));
  document.querySelectorAll('.tb-group[data-control]').forEach((group) => {
    group.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      ui[group.dataset.control] = button.dataset.value;
      syncControls();
      render();
    });
  });
  const reduce = document.getElementById('reduce');
  reduce.checked = reduceMotion;
  reduce.addEventListener('change', () => { reduceMotion = reduce.checked; render(); });
  document.getElementById('replay').addEventListener('click', render);
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 200); });
  window.addEventListener('keydown', handleKey);
  syncControls();
}

setupControls();
document.fonts.ready.then(() => { render(); requestAnimationFrame(loop); });
</script>
</body>
</html>
