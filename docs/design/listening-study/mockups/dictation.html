<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chép chính tả — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<style>
.light {
  --primary: #4B44C8; --on-primary: #FFFFFF; --primary-container: #E4E2FF; --on-primary-container: #16105A;
  --secondary: #515771; --on-secondary: #FFFFFF; --secondary-container: #DFE2F2; --on-secondary-container: #151A2E;
  --tertiary: #A3306B; --on-tertiary: #FFFFFF; --tertiary-container: #FFD8E7; --on-tertiary-container: #3D0022;
  --correct: #006B5E; --on-correct: #FFFFFF; --correct-container: #C2F0E7; --on-correct-container: #00201B;
  --wrong: #A52E17; --on-wrong: #FFFFFF; --wrong-container: #FFDBD1; --on-wrong-container: #3D0700;
  --warning: #844F00; --on-warning: #FFFFFF; --warning-container: #FFDDB5; --on-warning-container: #2B1700;
  --info: #005E9F; --on-info: #FFFFFF; --info-container: #D3E4FF; --on-info-container: #001C38;
  --surface: #F4F4F7; --card: #FFFFFF; --surface-low: #FAFAFC; --surface-container: #EDEDF1;
  --surface-high: #E7E7EC; --surface-highest: #E1E1E7; --surface-bright: #FAFAFC;
  --on-surface: #18181D; --on-surface-variant: #55555F; --outline: #81818C; --outline-variant: #D3D3DA;
  --inverse-surface: #2C2C33; --inverse-on-surface: #F0F0F4; --inverse-primary: #BDB8FF;
  --bar: rgba(244, 244, 247, 0.78); --scrim: rgba(0, 0, 0, 0.32);
  --shadow-card: 0 1px 2px #0000000A, 0 4px 16px #0000000F;
  --shadow-raised: 0 2px 6px #0000000F, 0 12px 32px #0000001A;
  --shadow-sheet: 0 -4px 24px #00000014;
  --shimmer: rgba(255, 255, 255, 0.55);
  --kb: #D1D3D9; --key: #FFFFFF; --key-alt: #ABB0BA;
  color-scheme: light;
}
.dark {
  --primary: #BDB8FF; --on-primary: #221A84; --primary-container: #342CA6; --on-primary-container: #E4E2FF;
  --secondary: #BCC2DE; --on-secondary: #262C42; --secondary-container: #3C4259; --on-secondary-container: #DFE2F2;
  --tertiary: #FFB0D2; --on-tertiary: #600038; --tertiary-container: #841650; --on-tertiary-container: #FFD8E7;
  --correct: #5ADACB; --on-correct: #003730; --correct-container: #005046; --on-correct-container: #C2F0E7;
  --wrong: #FF8E6B; --on-wrong: #611300; --wrong-container: #7D1B06; --on-wrong-container: #FFDBD1;
  --warning: #FFB960; --on-warning: #482900; --warning-container: #673D00; --on-warning-container: #FFDDB5;
  --info: #A2C9FF; --on-info: #003259; --info-container: #00487D; --on-info-container: #D3E4FF;
  --surface: #0B0B0E; --card: #1B1B20; --surface-low: #141418; --surface-container: #1B1B20;
  --surface-high: #25252B; --surface-highest: #303037; --surface-bright: #303037;
  --on-surface: #E1E1E7; --on-surface-variant: #B4B4BF; --outline: #8A8A96; --outline-variant: #3A3A42;
  --inverse-surface: #E1E1E7; --inverse-on-surface: #2C2C33; --inverse-primary: #4B44C8;
  --bar: rgba(11, 11, 14, 0.72); --scrim: rgba(0, 0, 0, 0.48);
  --shadow-card: none;
  --shadow-raised: 0 12px 32px #00000066;
  --shadow-sheet: none;
  --shimmer: rgba(255, 255, 255, 0.06);
  --kb: #2B2B30; --key: #5A5A60; --key-alt: #3F3F45;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: #E4E4EA; color: #18181D; min-height: 100vh; }
button, input, textarea { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
  display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; flex: none;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; }
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.ms.sm { font-size: 20px; } .ms.xs { font-size: 16px; } .ms.lg { font-size: 28px; }

.toolbar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  padding: 12px 20px; background: rgba(250, 250, 252, 0.85); backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid #D3D3DA; font-size: 13px; }
.tb-title { display: flex; flex-direction: column; margin-right: auto; max-width: 520px; }
.tb-title strong { font-size: 15px; } .tb-title span { color: #55555F; font-size: 12px; }
.tb-title a { color: #4B44C8; }
.tb-group { display: flex; flex-wrap: wrap; align-items: center; background: #E7E7EC; border-radius: 10px; padding: 2px; }
.tb-group > span { padding: 0 8px; color: #55555F; font-size: 12px; }
.tb-group button { padding: 6px 10px; border-radius: 8px; font-size: 13px; color: #55555F; font-weight: 500; }
.tb-group button[aria-pressed="true"] { background: #FFFFFF; color: #18181D; box-shadow: 0 1px 2px #0000001A; }
.tb-toggle { display: flex; gap: 6px; align-items: center; }
.tb-btn { padding: 7px 12px; border-radius: 10px; background: #4B44C8; color: #FFFFFF; font-weight: 600; font-size: 13px; }
.haptic-log { min-width: 190px; font-size: 12px; color: #55555F; display: flex; gap: 6px; align-items: center; }
.stage { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start; padding: 32px 20px 80px; }
.cell { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.cell-label { font-size: 13px; color: #55555F; font-weight: 500; }
.scaler { position: relative; }
.scaler > .device { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

.device { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: var(--surface); color: var(--on-surface);
  overflow: hidden; position: relative; -webkit-font-smoothing: antialiased; isolation: isolate; }
.device.phone { width: 390px; height: 844px; border-radius: 54px;
  box-shadow: 0 0 0 10px #0E0E10, 0 0 0 11px #3A3A42, 0 30px 60px -10px #00000055; }
.device.desktop { width: 1280px; height: 800px; border-radius: 12px; box-shadow: 0 0 0 1px #00000026, 0 30px 80px -20px #00000066; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 50px; padding: 16px 32px 0; display: flex;
  justify-content: space-between; font-size: 16px; font-weight: 600; z-index: 60; pointer-events: none; }
.status .icons { display: flex; gap: 4px; } .status .ms { font-size: 18px; }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px;
  background: var(--on-surface); z-index: 80; pointer-events: none; }
.win-bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--surface-low);
  border-bottom: 1px solid var(--outline-variant); position: relative; z-index: 60; }
.win-bar i { width: 12px; height: 12px; border-radius: 999px; background: var(--outline-variant); }
.win-bar span { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--on-surface-variant); pointer-events: none; }
.win-body { position: absolute; top: 38px; left: 0; right: 0; bottom: 0; }

.t-display { font-size: 56px; line-height: 64px; font-weight: 700; letter-spacing: -0.5px; }
.t-large-title { font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.4px; }
.t-title1 { font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -0.3px; }
.t-title2 { font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -0.2px; }
.t-title3 { font-size: 19px; line-height: 26px; font-weight: 600; letter-spacing: -0.1px; }
.t-headline { font-size: 17px; line-height: 24px; font-weight: 600; }
.t-body { font-size: 17px; line-height: 26px; }
.t-reading { font-size: 18px; line-height: 30px; }
.t-callout { font-size: 16px; line-height: 24px; }
.t-subheadline { font-size: 15px; line-height: 22px; }
.t-label { font-size: 15px; line-height: 20px; font-weight: 600; }
.t-footnote { font-size: 13px; line-height: 18px; }
.t-caption { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.2px; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--on-surface-variant); }
.grow { flex: 1; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.device :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 24px;
  border-radius: 14px; font-size: 17px; line-height: 24px; font-weight: 600; position: relative; user-select: none;
  transition: transform 100ms cubic-bezier(0.2, 0, 0, 1); white-space: nowrap; }
.btn::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0;
  transition: opacity 100ms; pointer-events: none; }
.btn:hover::after { opacity: 0.08; } .btn:active::after { opacity: 0.12; }
.btn::before { content: ''; position: absolute; left: 0; right: 0; top: min(0px, calc(50% - 24px)); bottom: min(0px, calc(50% - 24px)); }
.btn:active { transform: scale(0.97); }
.reduce .btn:active { transform: none; }
.desktop .btn { height: 44px; font-size: 15px; padding: 0 20px; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-secondary { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn-text { height: 48px; padding: 0 12px; color: var(--primary); font-size: 15px; font-weight: 600; }
.btn-small { height: 40px !important; padding: 0 14px !important; font-size: 15px !important; border-radius: 10px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.38; pointer-events: none; }
.btn kbd { font: inherit; font-size: 12px; font-weight: 500; opacity: 0.75; }
.icon-btn { width: 48px; height: 48px; border-radius: 999px; display: grid; place-items: center; position: relative; flex: none; }
.icon-btn:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.icon-btn:active { background: color-mix(in srgb, var(--on-surface) 12%, transparent); }
.icon-btn[disabled] { opacity: 0.38; pointer-events: none; }
kbd.k { font: inherit; font-weight: 600; font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--surface-container);
  border: 1px solid var(--outline-variant); color: var(--on-surface); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px;
  line-height: 16px; font-weight: 500; letter-spacing: 0.2px; background: var(--surface-high); color: var(--on-surface-variant); white-space: nowrap; }
.chip { height: 40px; padding: 0 14px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; position: relative;
  background: var(--card); box-shadow: inset 0 0 0 1px var(--outline); font-size: 15px; font-weight: 600; white-space: nowrap; flex: none;
  transition: background-color 150ms, box-shadow 150ms, color 150ms; }
.chip::before { content: ''; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px; }
.chip[aria-pressed="true"] { background: var(--primary-container); color: var(--on-primary-container); box-shadow: inset 0 0 0 2px var(--primary); }
.chip[disabled] { opacity: 0.38; pointer-events: none; }
.chip .ms { font-size: 18px; margin-left: -4px; }
.chip small { font-weight: 400; font-size: 13px; opacity: 0.8; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--info-container); color: var(--on-info-container); }
.banner .ms { color: var(--info); }
.banner.warning { background: var(--warning-container); color: var(--on-warning-container); }
.banner.warning .ms { color: var(--warning); }
.skel { background: var(--surface-high); border-radius: 10px; position: relative; overflow: hidden; }
.skel::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--shimmer), transparent); animation: shimmer 1.2s cubic-bezier(0.2, 0, 0, 1) infinite; }
.reduce .skel::after { animation: none; display: none; }
@keyframes shimmer { to { transform: translateX(100%); } }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 32px 24px; }
.error-icon { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; margin-bottom: 8px; background: var(--wrong-container); color: var(--on-wrong-container); }
.i0 { fill: var(--card); stroke: var(--on-surface); stroke-opacity: 0.7; stroke-width: 2; stroke-linejoin: round; }
.i1 { fill: var(--primary-container); } .i2 { fill: var(--primary); } .i3 { fill: var(--tertiary-container); }
.is { fill: none; stroke: var(--on-surface); stroke-opacity: 0.7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 14px; background: var(--surface-high); }
.seg button { position: relative; z-index: 1; height: 40px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--on-surface-variant); transition: color 150ms; }
.seg button[aria-checked="true"] { color: var(--on-surface); }
.seg button[disabled] { opacity: 0.38; pointer-events: none; }
.seg .ind { position: absolute; top: 4px; left: 4px; height: 40px; border-radius: 10px; background: var(--surface-bright); box-shadow: var(--shadow-card); transition: transform var(--snappy); }
.reduce .seg .ind { transition: none; }
.switch { width: 52px; height: 32px; border-radius: 999px; position: relative; flex: none; background: var(--surface-highest); box-shadow: inset 0 0 0 2px var(--outline); }
.switch::after { content: ''; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 999px; background: var(--outline); transition: transform var(--snappy); }
.switch[aria-checked="true"] { background: var(--primary); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--on-primary); width: 24px; height: 24px; top: 4px; left: 4px; }
.pbar { height: 4px; border-radius: 999px; background: var(--surface-high); overflow: hidden; }
.pbar > i { display: block; height: 100%; background: var(--primary); border-radius: inherit; transform-origin: 0 50%; }
.list { background: var(--card); border-radius: 14px; box-shadow: var(--shadow-card); overflow: hidden; }
.dark .list { background: var(--surface-container); }
.row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 8px 8px 16px; position: relative; width: 100%; text-align: left; }
.row + .row::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--outline-variant); }
.tile { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--primary-container); color: var(--on-primary-container); }
.tile .ms { font-size: 20px; }
.ring { display: block; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--surface-high); }
.ring .fill { fill: none; stroke: var(--primary); stroke-linecap: round; }
.roller { display: inline-flex; overflow: hidden; line-height: 1.2; height: 1.2em; vertical-align: bottom; }
.roller .digit { display: inline-block; height: 1.2em; overflow: hidden; }
.roller .digits { display: flex; flex-direction: column; }
.roller .digits span { height: 1.2em; }

.nav-host { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; }
.phone .layer { padding-top: 50px; }
.layer .dim { position: absolute; inset: 0; background: #000000; opacity: 0.08; pointer-events: none; z-index: 30; }
.d-bar { flex: none; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 4px; position: relative; }
.desktop .d-bar { height: 64px; padding: 0 16px 0 8px; border-bottom: 1px solid var(--outline-variant); background: var(--surface-low); }
.d-progress { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: 160px; }
.d-progress .pbar { width: 100%; }
.d-bar .right { margin-left: auto; display: flex; align-items: center; }
.d-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 12px; }
.d-body::-webkit-scrollbar { display: none; }
.desktop .d-body { padding: 32px 0 24px; width: 720px; margin: 0 auto; gap: 16px; }
.d-foot { flex: none; padding: 8px 20px 42px; display: flex; flex-direction: column; gap: 4px; }
.desktop .d-foot { width: 720px; margin: 0 auto; padding: 0 0 12px; flex-direction: row; align-items: center; gap: 8px; }
.shortcuts { flex: none; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 20px; padding: 12px 0 18px; color: var(--on-surface-variant); font-size: 13px; }

.audio-card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow-card); padding: 16px; display: flex; align-items: center; gap: 16px; }
.dark .audio-card { background: var(--surface-container); }
.audio-card.compact { padding: 10px 12px; gap: 12px; border-radius: 14px; }
.audio-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.audio-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.play { width: 72px; height: 72px; border-radius: 999px; display: grid; place-items: center; position: relative; flex: none; background: var(--primary); color: var(--on-primary); transition: transform 100ms cubic-bezier(0.2, 0, 0, 1); }
.play:active { transform: scale(0.95); }
.reduce .play:active { transform: none; }
.play .ms { font-size: 36px; }
.play svg { position: absolute; inset: -6px; transform: rotate(-90deg); pointer-events: none; }
.play svg circle { fill: none; stroke-width: 3; }
.play svg .track { stroke: var(--surface-high); }
.play svg .prog { stroke: var(--primary); stroke-linecap: round; }
.audio-card.compact .play { width: 48px; height: 48px; }
.audio-card.compact .play .ms { font-size: 26px; }
.audio-card.compact .play svg { inset: -4px; }
.wave { position: relative; height: 32px; }
.wave .bars { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; }
.wave .bars i { width: 2px; border-radius: 2px; background: var(--outline-variant); flex: none; }
.wave .bars.played { clip-path: inset(0 100% 0 0); }
.wave .bars.played i { background: var(--primary); }
.tool { height: 40px; padding: 0 12px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; position: relative;
  background: var(--surface-high); color: var(--on-surface); }
.tool::before { content: ''; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px; }
.tool:hover { background: color-mix(in srgb, var(--on-surface) 8%, var(--surface-high)); }
.tool[aria-pressed="true"] { background: var(--primary-container); color: var(--on-primary-container); }
.tool kbd { font: inherit; font-size: 11px; font-weight: 500; opacity: 0.7; }
.field-wrap { background: var(--card); border-radius: 20px; box-shadow: var(--shadow-card); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.dark .field-wrap { background: var(--surface-container); }
.field-label { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
.field { width: 100%; min-height: 120px; resize: none; padding: 14px 16px; border-radius: 14px; background: var(--surface-high); box-shadow: inset 0 0 0 1px var(--outline);
  font-size: 18px; line-height: 30px; color: var(--on-surface); outline: none; transition: box-shadow 150ms; }
.field:focus { box-shadow: inset 0 0 0 2px var(--primary); }
.field::placeholder { color: var(--on-surface-variant); }
.phone .field { min-height: 96px; }
.hint-line { display: flex; align-items: center; gap: 6px; padding: 0 4px; color: var(--on-surface-variant); }
.hint-line .ms { color: var(--info); }

.diff { font-size: 18px; line-height: 40px; word-spacing: 2px; padding: 4px 4px 0; }
.tok { display: inline-block; line-height: 30px; }
.tok.ok { color: var(--correct); text-decoration: underline 2px; text-underline-offset: 6px; }
.tok.bad s { color: var(--wrong); text-decoration-thickness: 2px; }
.tok .fix, .tok.miss { display: inline-flex; align-items: center; height: 30px; padding: 0 8px; border-radius: 8px; margin-left: 4px; font-weight: 600; }
.tok .fix { background: var(--correct-container); color: var(--on-correct-container); }
.tok.miss { margin-left: 0; color: var(--correct); outline: 1.5px dashed var(--correct); outline-offset: -1.5px; }
.tok.extra s { color: var(--on-surface-variant); text-decoration-style: dotted; text-decoration-thickness: 2px; }
.tok.hinted { color: var(--correct); text-decoration: underline dotted 2px var(--info); text-underline-offset: 6px; }
.tok.hinted .ms { font-size: 16px; color: var(--info); vertical-align: -2px; margin-left: 2px; }
.tok.accepted { cursor: help; }
.tok.accepted small { font-size: 12px; color: var(--on-surface-variant); margin-left: 4px; text-decoration: none; display: inline-block; }
.result-head { display: flex; align-items: center; gap: 14px; }
.score { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; flex: none; background: var(--primary-container); color: var(--on-primary-container); font-weight: 700; font-size: 19px; }
.score.perfect { background: var(--correct-container); color: var(--on-correct-container); }
.score .ms { font-size: 34px; }
