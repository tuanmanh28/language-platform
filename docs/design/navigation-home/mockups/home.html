<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hôm nay — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<style>
.light {
  --primary: #4B44C8; --on-primary: #FFFFFF; --primary-container: #E4E2FF; --on-primary-container: #16105A;
  --secondary: #515771; --on-secondary: #FFFFFF; --secondary-container: #DFE2F2; --on-secondary-container: #151A2E;
  --tertiary: #A3306B; --on-tertiary: #FFFFFF; --tertiary-container: #FFD8E7; --on-tertiary-container: #3D0022;
  --correct: #006B5E; --on-correct: #FFFFFF; --correct-container: #C2F0E7; --on-correct-container: #00201B;
  --wrong: #A52E17; --on-wrong: #FFFFFF; --wrong-container: #FFDBD1; --on-wrong-container: #3D0700;
  --warning: #844F00; --on-warning: #FFFFFF; --warning-container: #FFDDB5; --on-warning-container: #2B1700;
  --info: #005E9F; --on-info: #FFFFFF; --info-container: #D3E4FF; --on-info-container: #001C38;
  --surface: #F4F4F7; --card: #FFFFFF; --surface-low: #FAFAFC; --surface-container: #EDEDF1;
  --surface-high: #E7E7EC; --surface-highest: #E1E1E7; --surface-bright: #FAFAFC;
  --on-surface: #18181D; --on-surface-variant: #55555F; --outline: #81818C; --outline-variant: #D3D3DA;
  --inverse-surface: #2C2C33; --inverse-on-surface: #F0F0F4;
  --bar: rgba(244, 244, 247, 0.78); --scrim: rgba(0, 0, 0, 0.32); --highlight: rgba(255, 221, 181, 0.7);
  --shadow-card: 0 1px 2px #0000000A, 0 4px 16px #0000000F;
  --shadow-raised: 0 2px 6px #0000000F, 0 12px 32px #0000001A;
  --shadow-sheet: 0 -4px 24px #00000014;
  --shimmer: rgba(255, 255, 255, 0.55);
  color-scheme: light;
}
.dark {
  --primary: #BDB8FF; --on-primary: #221A84; --primary-container: #342CA6; --on-primary-container: #E4E2FF;
  --secondary: #BCC2DE; --on-secondary: #262C42; --secondary-container: #3C4259; --on-secondary-container: #DFE2F2;
  --tertiary: #FFB0D2; --on-tertiary: #600038; --tertiary-container: #841650; --on-tertiary-container: #FFD8E7;
  --correct: #5ADACB; --on-correct: #003730; --correct-container: #005046; --on-correct-container: #C2F0E7;
  --wrong: #FF8E6B; --on-wrong: #611300; --wrong-container: #7D1B06; --on-wrong-container: #FFDBD1;
  --warning: #FFB960; --on-warning: #482900; --warning-container: #673D00; --on-warning-container: #FFDDB5;
  --info: #A2C9FF; --on-info: #003259; --info-container: #00487D; --on-info-container: #D3E4FF;
  --surface: #0B0B0E; --card: #1B1B20; --surface-low: #141418; --surface-container: #1B1B20;
  --surface-high: #25252B; --surface-highest: #303037; --surface-bright: #303037;
  --on-surface: #E1E1E7; --on-surface-variant: #B4B4BF; --outline: #8A8A96; --outline-variant: #3A3A42;
  --inverse-surface: #E1E1E7; --inverse-on-surface: #2C2C33;
  --bar: rgba(11, 11, 14, 0.72); --scrim: rgba(0, 0, 0, 0.48); --highlight: rgba(103, 61, 0, 0.7);
  --shadow-card: none;
  --shadow-raised: 0 12px 32px #00000066;
  --shadow-sheet: none;
  --shimmer: rgba(255, 255, 255, 0.06);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: #E4E4EA; color: #18181D; min-height: 100vh; }
button, input { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
  display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; flex: none;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; }
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.ms.sm { font-size: 20px; } .ms.lg { font-size: 28px; }

.toolbar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  padding: 12px 20px; background: rgba(250, 250, 252, 0.85); backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid #D3D3DA; font-size: 13px; }
.tb-title { display: flex; flex-direction: column; margin-right: auto; }
.tb-title strong { font-size: 15px; } .tb-title span { color: #55555F; font-size: 12px; }
.tb-title a { color: #4B44C8; }
.tb-group { display: flex; align-items: center; background: #E7E7EC; border-radius: 10px; padding: 2px; flex-wrap: wrap; }
.tb-group > span { padding: 0 8px; color: #55555F; font-size: 12px; }
.tb-group button { padding: 6px 10px; border-radius: 8px; font-size: 13px; color: #55555F; font-weight: 500; }
.tb-group button[aria-pressed="true"] { background: #FFFFFF; color: #18181D; box-shadow: 0 1px 2px #0000001A; }
.tb-toggle { display: flex; gap: 6px; align-items: center; }
.tb-btn { padding: 7px 12px; border-radius: 10px; background: #4B44C8; color: #FFFFFF; font-weight: 600; font-size: 13px; }
.haptic-log { min-width: 190px; font-size: 12px; color: #55555F; display: flex; gap: 6px; align-items: center; }
.stage { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start; padding: 32px 20px 80px; }
.cell { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.cell-label { font-size: 13px; color: #55555F; font-weight: 500; }
.scaler { position: relative; }
.scaler > .device { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

.device { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: var(--surface); color: var(--on-surface);
  overflow: hidden; position: relative; -webkit-font-smoothing: antialiased; isolation: isolate; }
.device.phone { width: 390px; height: 844px; border-radius: 54px;
  box-shadow: 0 0 0 10px #0E0E10, 0 0 0 11px #3A3A42, 0 30px 60px -10px #00000055; }
.device.tablet { width: 834px; height: 1112px; border-radius: 36px;
  box-shadow: 0 0 0 12px #0E0E10, 0 0 0 13px #3A3A42, 0 30px 60px -10px #00000055; }
.device.desktop { width: 1280px; height: 800px; border-radius: 12px; box-shadow: 0 0 0 1px #00000026, 0 30px 80px -20px #00000066; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 50px; padding: 16px 32px 0; display: flex;
  justify-content: space-between; font-size: 16px; font-weight: 600; z-index: 60; pointer-events: none; }
.tablet .status { height: 28px; padding: 6px 28px 0; font-size: 13px; }
.status .icons { display: flex; gap: 4px; } .status .ms { font-size: 18px; }
.tablet .status .ms { font-size: 15px; }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px;
  background: var(--on-surface); z-index: 60; pointer-events: none; }
.tablet .home-ind { width: 200px; margin-left: -100px; }
.win-bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--surface-low);
  border-bottom: 1px solid var(--outline-variant); position: relative; z-index: 60; }
.win-bar i { width: 12px; height: 12px; border-radius: 999px; background: var(--outline-variant); }
.win-bar span { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--on-surface-variant); pointer-events: none; }
.win-body { position: absolute; top: 38px; left: 0; right: 0; bottom: 0; display: flex; }
.tablet .win-body { top: 0; }

.t-display { font-size: 56px; line-height: 64px; font-weight: 700; letter-spacing: -0.5px; }
.t-large-title { font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.4px; }
.t-title1 { font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -0.3px; }
.t-title2 { font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -0.2px; }
.t-title3 { font-size: 19px; line-height: 26px; font-weight: 600; letter-spacing: -0.1px; }
.t-headline { font-size: 17px; line-height: 24px; font-weight: 600; }
.t-body { font-size: 17px; line-height: 26px; }
.t-reading { font-size: 18px; line-height: 30px; }
.t-callout { font-size: 16px; line-height: 24px; }
.t-subheadline { font-size: 15px; line-height: 22px; }
.t-label { font-size: 15px; line-height: 20px; font-weight: 600; }
.t-footnote { font-size: 13px; line-height: 18px; }
.t-caption { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.2px; }
.t-caption2 { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.3px; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--on-surface-variant); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.device :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 24px;
  border-radius: 14px; font-size: 17px; line-height: 24px; font-weight: 600; position: relative; user-select: none;
  transition: transform 100ms cubic-bezier(0.2, 0, 0, 1); }
.btn::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0;
  transition: opacity 100ms; pointer-events: none; }
.btn:hover::after { opacity: 0.08; } .btn:active::after { opacity: 0.12; }
.btn::before { content: ''; position: absolute; left: 0; right: 0; top: min(0px, calc(50% - 24px)); bottom: min(0px, calc(50% - 24px)); }
.btn:active { transform: scale(0.97); }
.reduce .btn:active { transform: none; }
.desktop .btn { height: 44px; font-size: 15px; padding: 0 20px; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-secondary { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn-text { height: 48px; padding: 0 12px; color: var(--primary); font-size: 15px; font-weight: 600; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.38; pointer-events: none; }
.icon-btn { width: 48px; height: 48px; border-radius: 999px; display: grid; place-items: center; position: relative; flex: none; }
.icon-btn:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.icon-btn:active { background: color-mix(in srgb, var(--on-surface) 12%, transparent); }

.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow-card); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px;
  line-height: 16px; font-weight: 500; letter-spacing: 0.2px; background: var(--surface-high); color: var(--on-surface-variant); }
.tag .ms { font-size: 20px; margin-left: -4px; }
.tag.primary { background: var(--primary-container); color: var(--on-primary-container); }
.tag.tertiary { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.pbar { height: 6px; border-radius: 999px; background: var(--surface-high); overflow: hidden; }
.pbar > i { display: block; height: 100%; background: var(--primary); border-radius: inherit; transform-origin: 0 50%; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; margin: 28px 0 10px; }
.list { background: var(--card); border-radius: 14px; box-shadow: var(--shadow-card); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; position: relative; width: 100%; text-align: left; }
.row + .row::before { content: ''; position: absolute; top: 0; left: 60px; right: 0; border-top: 1px solid var(--outline-variant); }
.row.clickable { cursor: pointer; }
.row.clickable:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.row.clickable:active { background: color-mix(in srgb, var(--on-surface) 12%, transparent); }
button.row:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.tile { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.tile .ms { font-size: 20px; }
.tile.primary { background: var(--primary-container); color: var(--on-primary-container); }
.tile.tertiary { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.tile.correct { background: var(--correct-container); color: var(--on-correct-container); }
.tile.info { background: var(--info-container); color: var(--on-info-container); }
.grow { flex: 1; min-width: 0; }
.chev { color: var(--outline); }
.row.done .t-headline { color: var(--on-surface-variant); }
.done-mark { color: var(--correct); }
.trail { width: 48px; height: 48px; display: grid; place-items: center; flex: none; margin-right: -8px; }
.play-inline { width: 48px; height: 48px; border-radius: 999px; display: grid; place-items: center; position: relative; flex: none; margin-right: -8px; }
.play-inline > span { width: 36px; height: 36px; border-radius: 999px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.play-inline .ms { font-size: 22px; }
.banner { display: flex; gap: 12px; align-items: center; min-height: 56px; padding: 10px 14px; border-radius: 14px;
  background: var(--info-container); color: var(--on-info-container); margin-bottom: 16px; }
.banner .ms { color: var(--info); }
.skel { background: var(--surface-high); border-radius: 10px; position: relative; overflow: hidden; }
.skel::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--shimmer), transparent); animation: shimmer 1.2s cubic-bezier(0.2, 0, 0, 1) infinite; }
.reduce .skel::after { animation: none; display: none; }
@keyframes shimmer { to { transform: translateX(100%); } }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 24px; }
.empty .btn-primary { margin-top: 16px; }
.error-icon { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; margin-bottom: 8px;
  background: var(--wrong-container); color: var(--on-wrong-container); }
.ring { display: block; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--surface-high); }
.ring .fill { fill: none; stroke: var(--primary); stroke-linecap: round; }
.ring .fill.tertiary { stroke: var(--tertiary); }
.roller { display: inline-flex; overflow: hidden; line-height: 1.2; height: 1.2em; vertical-align: bottom; }
.roller .digit { display: inline-block; height: 1.2em; overflow: hidden; }
.roller .digits { display: flex; flex-direction: column; }
.roller .digits span { height: 1.2em; }
.i0 { fill: var(--card); stroke: var(--on-surface); stroke-opacity: 0.7; stroke-width: 2; stroke-linejoin: round; }
.i1 { fill: var(--primary-container); } .i2 { fill: var(--primary); } .i3 { fill: var(--tertiary-container); }
.is { fill: none; stroke: var(--on-surface); stroke-opacity: 0.7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.sheet-layer { position: absolute; inset: 0; z-index: 70; display: flex; align-items: flex-end; }
.desktop .sheet-layer, .tablet .sheet-layer { align-items: center; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: relative; width: 100%; background: var(--card); border-radius: 28px 28px 0 0; padding: 8px 20px 40px;
  box-shadow: var(--shadow-sheet); touch-action: none; }
.desktop .sheet, .tablet .sheet { width: 560px; border-radius: 20px; padding: 28px; box-shadow: var(--shadow-raised); }
.handle { width: 36px; height: 5px; border-radius: 3px; background: var(--outline-variant); margin: 0 auto 16px; }
.desktop .handle, .tablet .handle { display: none; }

.main { flex: 1; position: relative; }
.nav-host { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; }
.layer .dim { position: absolute; inset: 0; background: #000000; opacity: 0.08; pointer-events: none; z-index: 30; }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.phone .screen { padding: 50px 0 100px; }
.tablet .screen { padding: 36px 24px 40px; }
.desktop .screen { padding: 8px 32px 40px; }
.content { max-width: 1080px; margin: 0 auto; }
.topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid transparent; transition: background-color 150ms, border-color 150ms; }
.phone .topbar { height: 94px; padding-top: 50px; }
.tablet .topbar { height: 80px; padding-top: 28px; }
.desktop .topbar { height: 52px; }
.topbar .bar-title { opacity: 0; transition: opacity 150ms; }
.scrolled > .topbar, .topbar.solid { background: var(--bar); backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%); border-bottom-color: var(--outline-variant); }
.scrolled > .topbar .bar-title, .topbar.solid .bar-title { opacity: 1; }
.topbar .back { position: absolute; left: 4px; bottom: 0; display: flex; align-items: center; height: 48px; padding: 0 8px; color: var(--primary); font-size: 17px; }
.desktop .topbar .back { bottom: 2px; font-size: 15px; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 6px 4px 0; display: flex; z-index: 40;
  background: var(--bar); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-top: 1px solid var(--outline-variant); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 50px; justify-content: center;
  color: var(--on-surface-variant); font-size: 12px; line-height: 16px; font-weight: 500; position: relative; }
.tab .ms { font-size: 28px; }
.tab[aria-selected="true"] { color: var(--primary); }
.tab[aria-selected="true"] .ms, .rail-item[aria-selected="true"] .ms, .side-item[aria-selected="true"] .ms { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.badge { position: absolute; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--primary);
  color: var(--on-primary); font-size: 11px; line-height: 18px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.tab .badge { top: 0; left: calc(50% + 6px); }
.rail { width: 80px; flex: none; padding: 40px 0 24px; display: flex; flex-direction: column; align-items: center; gap: 12px;
  background: var(--surface-low); border-right: 1px solid var(--outline-variant); position: relative; z-index: 40; }
.rail > .icon-btn { margin-bottom: 20px; }
.rail-item { width: 80px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 4px; position: relative;
  color: var(--on-surface-variant); font-size: 12px; line-height: 16px; font-weight: 500; }
.rail-item .pill { width: 56px; height: 32px; display: grid; place-items: center; border-radius: 999px; }
.rail-item[aria-selected="true"] { color: var(--on-surface); font-weight: 600; }
.rail-item[aria-selected="true"] .pill { background: var(--primary-container); color: var(--on-primary-container); }
.rail-item .badge { top: -4px; left: 44px; }
.rail-streak { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--on-tertiary-container);
  background: var(--tertiary-container); border-radius: 16px; padding: 8px 10px; font-weight: 700; font-size: 15px; }
.rail-streak .ms { color: var(--tertiary); font-size: 22px; }
.sidebar { width: 248px; flex: none; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px;
  background: var(--surface-low); border-right: 1px solid var(--outline-variant); position: relative; z-index: 40; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 12px 16px; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--primary); color: var(--on-primary);
  display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.side-search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; margin: 0 0 12px; border-radius: 10px;
  background: var(--surface-high); color: var(--on-surface-variant); font-size: 15px; width: 100%; text-align: left; }
.side-search kbd { margin-left: auto; font: inherit; font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--card); }
.side-item { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border-radius: 10px;
  font-size: 15px; font-weight: 500; color: var(--on-surface-variant); width: 100%; text-align: left; position: relative; }
.side-item:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.side-item[aria-selected="true"] { background: var(--primary-container); color: var(--on-primary-container); font-weight: 600; }
.side-item .badge { position: static; margin-left: auto; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.sync { display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--on-surface-variant); font-size: 13px; line-height: 18px; }
.sync .ms { font-size: 18px; }

.lt { padding: 8px 20px 4px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.tablet .lt { padding: 8px 0 4px; }
.desktop .lt { padding: 24px 0 8px; }
.lt-actions { display: flex; align-items: center; gap: 4px; }
.pad { padding: 8px 20px 0; display: flex; flex-direction: column; }
.tablet .pad, .desktop .pad { padding: 8px 0 0; }

  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }

.speed { height: 36px; padding: 0 12px; border-radius: 10px; background: var(--surface-high); font-weight: 600; font-size: 15px; position: relative; }

.dict-field { width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 10px; background: var(--surface-high); border: 1px solid var(--outline); font-size: 17px; line-height: 26px; outline: none; }

<header class="toolbar">
  <div class="tb-title"><strong>Hôm nay</strong><span>Mockup · <a href="../README.md">spec §5.2–5.4</a> · chạm "Làm tiếp", các hàng kế hoạch, ▶ Nghe chép nhanh, chuỗi ngày · <a href="navigation.html">Điều hướng</a></span></div>
  <div class="tb-group" data-control="theme"><span>Giao diện</span><button data-value="light">Sáng</button><button data-value="dark">Tối</button><button data-value="both">Cả hai</button></div>
  <div class="tb-group" data-control="frame"><span>Khung</span><button data-value="phone">Điện thoại</button><button data-value="tablet">Máy tính bảng</button><button data-value="desktop">Máy tính</button><button data-value="both">Điện thoại + máy tính</button></div>
  <div class="tb-group" data-control="state"><span>Trạng thái</span></div>
  <label class="tb-toggle"><input type="checkbox" id="reduce"> Giảm chuyển động</label>
  <button class="tb-btn" id="replay">Phát lại</button>
  <div class="haptic-log" aria-live="polite"></div>
</header>
<main class="stage" id="stage"></main>
<script>
const SPRINGS = { snappy: [0.30, 0.88], smooth: [0.40, 1], bouncy: [0.45, 0.72], gentle: [0.60, 1] };
const DURATION = { instant: 100, short: 150, medium: 250, long: 400, extraLong: 700 };
const EASING = { standard: 'cubic-bezier(0.2, 0, 0, 1)', decelerate: 'cubic-bezier(0.05, 0.7, 0.1, 1)', accelerate: 'cubic-bezier(0.3, 0, 0.8, 0.15)' };
const STAGGER = 30;
const STATES = [['progress', 'Đang làm dở'], ['fresh', 'Ngày mới'], ['done', 'Xong kế hoạch'], ['goal', 'Đạt mục tiêu'], ['back', 'Quay lại sau 3 ngày'],
  ['empty', 'Người mới'], ['loading', 'Đang tải'], ['error', 'Lỗi'], ['offline', 'Ngoại tuyến']];
const ui = { theme: 'light', frame: 'both', state: 'progress' };
let reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const springCache = new Map();
function springTiming(name) {
  if (springCache.has(name)) return springCache.get(name);
  const [response, damping] = SPRINGS[name];
  const omega = (2 * Math.PI) / response;
  const values = [];
  let x = 0, v = 0, settle = 0;
  for (let step = 0; step < 3000; step++) {
    v += (-omega * omega * (x - 1) - 2 * damping * omega * v) / 1000;
    x += v / 1000;
    values.push(x);
    if (Math.abs(x - 1) > 0.001 || Math.abs(v) > 0.01) settle = step + 1;
  }
  const count = Math.max(settle, 100);
  const points = Array.from({ length: 61 }, (_, i) => (i === 0 ? 0 : i === 60 ? 1 : values[Math.round((i / 60) * count) - 1]));
  const timing = { duration: count, easing: `linear(${points.map((p) => p.toFixed(4)).join(', ')})` };
  springCache.set(name, timing);
  return timing;
}

function play(el, keyframes, motion = 'smooth', options = {}) {
  if (!el) return Promise.resolve();
  const { fallback, ...extra } = options;
  let frames = keyframes, timing = typeof motion === 'string' ? springTiming(motion) : motion;
  if (reduceMotion) {
    frames = fallback || keyframes.map(({ transform, ...rest }) => rest);
    timing = frames.some((f) => 'opacity' in f) ? { duration: DURATION.short, easing: EASING.standard } : { duration: 0 };
  }
  const animation = el.animate(frames, { ...timing, fill: 'both', ...extra });
  return animation.finished.then(() => {
    if (!el.isConnected) return;
    try { animation.commitStyles(); } catch (e) { }
    animation.cancel();
  }).catch(() => { });
}

function haptic(device, kind) {
  if (!device.classList.contains('phone')) return;
  log(`<span class="ms sm">vibration</span> Rung: ${kind}`);
}

function log(html) {
  const el = document.querySelector('.haptic-log');
  el.innerHTML = html;
  el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DURATION.short });
  clearTimeout(log.timer);
  log.timer = setTimeout(() => { el.textContent = ''; }, 2400);
}

function localRect(device, el) {
  const scale = Number(device.dataset.scale);
  const d = device.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: (r.left - d.left) / scale, y: (r.top - d.top) / scale, w: r.width / scale, h: r.height / scale };
}

function enter(root) {
  root.querySelectorAll('[data-stagger]').forEach((el, i) => {
    play(el, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], 'smooth', { delay: Math.min(i, 8) * STAGGER });
  });
  root.querySelectorAll('.ring .fill').forEach((circle) => {
    play(circle, [{ strokeDashoffset: circle.dataset.length }, { strokeDashoffset: circle.dataset.offset }], 'gentle', { delay: 120 });
  });
  root.querySelectorAll('.pbar > i:not([data-manual])').forEach((bar) => play(bar, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], 'gentle', { delay: 120 }));
  root.querySelectorAll('.roller').forEach(roll);
}

function roller(text) {
  const parts = [...String(text)].map((ch) => (/\d/.test(ch)
    ? `<span class="digit" aria-hidden="true"><span class="digits" data-digit="${ch}">${'0123456789'.split('').map((d) => `<span>${d}</span>`).join('')}</span></span>`
    : `<span aria-hidden="true">${ch}</span>`));
  return `<span class="roller tnum">${parts.join('')}<span class="sr">${text}</span></span>`;
}

function roll(el, from) {
  el.querySelectorAll('.digits').forEach((col, i) => {
    const target = `translateY(-${Number(col.dataset.digit) * 1.2}em)`;
    const start = from ? `translateY(-${Number(from[i] || 0) * 1.2}em)` : 'translateY(0)';
    col.style.transform = target;
    play(col, [{ transform: start }, { transform: target }], 'gentle', { delay: from ? 0 : 150 + i * 40 });
  });
}

function ring(size, stroke, fraction, tone = '') {
  const radius = (size - stroke) / 2;
  const length = 2 * Math.PI * radius;
  const offset = length * (1 - fraction);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="track" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${stroke}"/>
    <circle class="fill ${tone}" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${stroke}"
      stroke-dasharray="${length}" stroke-dashoffset="${offset}" data-length="${length}" data-offset="${offset}"/></svg>`;
}

const illustration = (frame, svg) => svg.replace('width="120" height="120"', `width="${frame === 'phone' ? 120 : 160}" height="${frame === 'phone' ? 120 : 160}"`);
const ILLO_BOOK = `<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
  <circle class="i3" cx="60" cy="50" r="32"/>
  <path class="i1" d="M12 68 Q36 58 60 70 Q84 58 108 68 V98 Q84 88 60 100 Q36 88 12 98 Z"/>
  <path class="i2" d="M12 98 Q36 88 60 100 Q84 88 108 98 V104 Q84 94 60 106 Q36 94 12 104 Z"/>
  <path class="is" d="M60 70 V100 M22 76 Q36 71 50 77 M22 84 Q36 79 50 85 M70 77 Q84 71 98 76 M70 85 Q84 79 98 84"/>
</svg>`;
const ILLO_SUNRISE = `<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
  <circle class="i3" cx="60" cy="66" r="30"/>
  <path class="is" d="M60 22 V30 M30 34 L35 40 M90 34 L85 40 M18 60 H26 M94 60 H102"/>
  <rect class="i1" x="18" y="66" width="84" height="38" rx="8"/>
  <rect class="i2" x="18" y="66" width="84" height="8" rx="4"/>
  <path class="is" d="M30 84 H74 M30 94 H62"/>
</svg>`;

const DESTINATIONS = [['home', 'Hôm nay', 'wb_sunny'], ['practice', 'Luyện đề', 'menu_book'], ['vocab', 'Từ vựng', 'style'], ['progress', 'Tiến độ', 'monitoring'], ['me', 'Tôi', 'person']];
const titleOf = (key) => DESTINATIONS.find(([k]) => k === key)[1];

const SCENARIOS = {
  progress: { day: 'Thứ Sáu, 2 tháng 10', done: [false, false, true], sessions: 3, week: [1, 1, 'rest', 1, 'today', 0, 0], streak: 12, due: 24 },
  fresh: { day: 'Thứ Sáu, 2 tháng 10', done: [false, false, false], sessions: 3, week: [1, 1, 'rest', 1, 'today', 0, 0], streak: 12, due: 24, noTest: true },
  done: { day: 'Thứ Sáu, 2 tháng 10', done: [true, true, true], sessions: 4, week: [1, 1, 'rest', 1, 'today-on', 0, 0], streak: 13, due: 0, noTest: true },
  goal: { day: 'Thứ Bảy, 3 tháng 10', done: [true, true, true], sessions: 5, week: [1, 1, 'rest', 1, 1, 'today-on', 0], streak: 14, due: 0, noTest: true },
  back: { day: 'Thứ Sáu, 2 tháng 10', done: [false, false], sessions: 1, week: [1, 0, 0, 0, 'today', 0, 0], streak: 0, due: 10, noTest: true, back: true },
  offline: { day: 'Thứ Sáu, 2 tháng 10', done: [false, false, true], sessions: 3, week: [1, 1, 'rest', 1, 'today', 0, 0], streak: 12, due: 24 },
};

function planItems(s) {
  if (s.back) return [
    ['review', 'primary', 'style', `Ôn ${s.due} thẻ đến hạn`, 'Từ vựng · khoảng 2 phút'],
    ['dictation', 'correct', 'headphones', 'Nghe chép nhanh', '3 câu · Cambridge 17 · Test 3 · Section 2'],
  ];
  return [
    ['review', 'primary', 'style', s.due ? `Ôn ${s.due} thẻ đến hạn` : 'Ôn 24 thẻ đến hạn', 'Từ vựng · khoảng 5 phút'],
    ['type', 'tertiary', 'target', 'Luyện Matching Headings', 'Dạng bạn hay sai nhất · 12 phút'],
    ['dictation', 'correct', 'headphones', 'Nghe chép nhanh', '3 câu · Cambridge 17 · Test 3 · Section 2'],
  ];
}

function largeTitle(frame, s, withStreak = true) {
  const caption = `<div class="t-footnote muted" style="font-weight:600">${s ? s.day : 'Thứ Sáu, 2 tháng 10'} · còn ${s && s.day.startsWith('Thứ Bảy') ? 70 : 71} ngày đến kỳ thi</div>`;
  const actions = [];
  if (frame === 'phone') actions.push('<button class="icon-btn" aria-label="Tìm kiếm" data-action="search"><span class="ms">search</span></button>');
  if (frame === 'phone' && withStreak && s) {
    actions.push(s.streak
      ? `<button class="streak" data-action="streak" aria-label="Chuỗi ${s.streak} ngày, mở chi tiết"><span class="ms fill">local_fire_department</span><span class="tnum">${roller(String(s.streak))}</span></button>`
      : '<button class="streak none" data-action="streak" aria-label="Chưa có chuỗi, mở chi tiết"><span class="ms">local_fire_department</span></button>');
  }
  return `<div class="lt" data-stagger><div>${caption}<h1 class="t-large-title">Hôm nay</h1></div><div class="lt-actions">${actions.join('')}</div></div>`;
}

function hero(frame, s) {
  const block = frame === 'phone' ? 'btn-block' : '';
  const doneCount = s.done.filter(Boolean).length;
  if (s.back) {
    return `<article class="card hero" data-stagger data-shared="hero"><div class="hero-top"><span class="tag tertiary"><span class="ms">waving_hand</span>Chào bạn</span></div>
      <h2 class="t-title2">Chào bạn quay lại</h2><p class="t-callout muted">Làm 5 phút để lấy lại nhịp nhé. Kế hoạch hôm nay được rút gọn còn 2 việc.</p>
      <div class="hero-actions"><button class="btn btn-primary ${block}" data-action="plan-start"><span class="ms">play_arrow</span>Bắt đầu 5 phút</button></div></article>`;
  }
  if (doneCount === s.done.length) {
    return `<article class="card hero quiet" data-stagger data-shared="hero">${illustration('phone', ILLO_SUNRISE).replace('width="120" height="120"', 'width="88" height="88"')}
      <div class="grow"><h2 class="t-title2">Xong kế hoạch hôm nay</h2><p class="t-callout muted">Bạn đã học 22 phút. Hẹn bạn ngày mai nhé.</p>
      <button class="btn btn-text" style="padding:0;margin-top:4px" data-action="more">Học thêm</button></div></article>`;
  }
  if (s.noTest) {
    const left = s.done.length - doneCount;
    return `<article class="card hero" data-stagger data-shared="hero"><div class="hero-top"><span class="tag primary"><span class="ms">wb_sunny</span>Kế hoạch</span><span class="t-footnote muted tnum">${left} việc · 20 phút</span></div>
      <h2 class="t-title2">Bắt đầu kế hoạch hôm nay</h2><p class="t-subheadline muted">Đầu tiên: ôn ${s.due} thẻ đến hạn, khoảng 5 phút</p>
      <div class="hero-actions"><button class="btn btn-primary ${block}" data-action="plan-start"><span class="ms">play_arrow</span>Bắt đầu</button></div></article>`;
  }
  return `<article class="card hero" data-stagger data-shared="hero">
    <div class="hero-top"><span class="tag primary"><span class="ms">edit</span>Đang làm</span><span class="t-footnote muted">Hôm qua, 21:40</span></div>
    <h2 class="t-title2">Cambridge 18 · Test 2</h2>
    <p class="t-subheadline muted">Reading · Passage 2 · Câu 18/40</p>
    <div class="pbar" role="progressbar" aria-label="Tiến độ bài làm" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100"><i style="width:45%"></i></div>
    <div class="hero-foot t-footnote muted"><span class="ms sm">timer</span>Còn 34 phút · 17 câu đã làm</div>
    <button class="btn btn-primary ${block}" data-action="continue"><span class="ms">play_arrow</span>Làm tiếp</button></article>`;
}

function planRow([kind, tone, icon, title, sub], done) {
  if (done) {
    return `<div class="row done" data-plan="${kind}"><span class="tile correct"><span class="ms">${icon}</span></span>
      <div class="grow"><div class="t-headline">${title}</div><div class="t-subheadline muted">${sub}</div></div><span class="trail"><span class="ms fill done-mark" aria-label="Đã xong">check_circle</span></span></div>`;
  }
  if (kind === 'dictation') {
    return `<div class="row clickable" data-plan="${kind}" data-action="dictation"><span class="tile ${tone}"><span class="ms">${icon}</span></span>
      <div class="grow" aria-hidden="true"><div class="t-headline">${title}</div><div class="t-subheadline muted">${sub}</div></div>
      <button class="play-inline" data-action="dictation" aria-label="${title}, ${sub}. Bắt đầu"><span><span class="ms fill">play_arrow</span></span></button></div>`;
  }
  return `<button class="row" data-plan="${kind}" data-action="${kind}"><span class="tile ${tone}"><span class="ms">${icon}</span></span>
    <div class="grow"><div class="t-headline">${title}</div><div class="t-subheadline muted">${sub}</div></div><span class="trail"><span class="ms chev">chevron_right</span></span></button>`;
}

function plan(s) {
  const items = planItems(s);
  const done = s.done.filter(Boolean).length;
  return `<div class="section-h" data-stagger><h2 class="t-title3">Kế hoạch hôm nay</h2><span class="t-footnote muted tnum" data-plan-count>${roller(`${done}/${items.length}`)} · ${s.back ? 5 : 20} phút</span></div>
    <div class="list" data-stagger>${items.map((item, i) => planRow(item, s.done[i])).join('')}</div>`;
}

function goalCard(s) {
  const target = 5;
  const reached = s.sessions >= target;
  const labels = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
  const names = ['thứ Hai', 'thứ Ba', 'thứ Tư', 'thứ Năm', 'thứ Sáu', 'thứ Bảy', 'Chủ nhật'];
  const studied = s.week.map((v, i) => (v === 1 || v === 'today-on' ? names[i] : null)).filter(Boolean);
  const rest = s.week.map((v, i) => (v === 'rest' ? names[i] : null)).filter(Boolean);
  const center = reached
    ? '<span class="ms fill lg" style="color:var(--tertiary)" data-goal-center>check</span>'
    : `<div data-goal-center><div class="t-title3">${roller(`${s.sessions}/${target}`)}</div><div class="t-caption2 muted">buổi</div></div>`;
  const left = target - s.sessions;
  const text = reached ? `${roller('5/5')} buổi · tuần sau giữ nhịp này nhé` : left === 1 ? 'Còn 1 buổi nữa là đạt mục tiêu tuần' : `Còn ${left} buổi nữa là đạt mục tiêu tuần`;
  return `<article class="card goal" data-stagger data-goal aria-label="Mục tiêu tuần: ${s.sessions} trên ${target} buổi">
    <div class="goal-ring">${ring(84, 10, Math.min(1, s.sessions / target), 'tertiary')}<div class="center">${center}</div></div>
    <div class="grow"><h2 class="t-headline">${reached ? 'Đạt mục tiêu tuần!' : 'Mục tiêu tuần'}</h2>
      <p class="t-subheadline muted" data-goal-text>${text}</p>
      <div class="week" role="img" aria-label="Tuần này: ${studied.length ? `đã học ${studied.join(', ')}` : 'chưa học ngày nào'}${rest.length ? `; ${rest.join(', ')} nghỉ` : ''}">${s.week.map((v, i) => `<span class="${String(v).startsWith('today') ? 'today' : ''}"><i class="${v === 1 || v === 'today-on' ? 'on' : v === 'rest' ? 'rest' : ''}"></i>${labels[i]}</span>`).join('')}</div>
    </div></article>`;
}

function weakCard() {
  return `<div class="section-h" data-stagger><h2 class="t-title3">Cần luyện thêm</h2><button class="btn btn-text" style="height:32px;padding:0" data-action="see-all">Xem tất cả</button></div>
  <article class="card stat" data-stagger>
    <div class="stat-row"><div class="top"><span class="t-headline">Matching Headings</span><span class="t-subheadline tnum">58% đúng</span></div>
      <div class="pbar"><i style="width:58%"></i></div>
      <span class="t-footnote muted"><span class="trend"><span class="ms sm">trending_up</span>+6%</span> so với tuần trước · 31 câu</span></div>
    <div class="stat-row"><div class="top"><span class="t-headline">Sentence Completion</span><span class="t-subheadline tnum">71% đúng</span></div>

}

function skeleton(frame) {
  const block = (h, extra = '') => `<div class="skel" style="height:${h}px;${extra}"></div>`;
  const heroSk = `<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:12px">${block(24, 'width:30%')}${block(28, 'width:70%')}${block(18, 'width:50%')}${block(6)}${block(52, 'border-radius:14px')}</div>`;
  const goalSk = `<div class="card" style="padding:18px 20px;display:flex;gap:18px;align-items:center">${block(84, 'width:84px;border-radius:999px;flex:none')}<div style="flex:1;display:flex;flex-direction:column;gap:10px">${block(20, 'width:60%')}${block(16)}${block(12, 'width:80%')}</div></div>`;
  const listSk = `<div class="list">${[0, 1, 2].map(() => `<div class="row">${block(32, 'width:32px;flex:none')}<div style="flex:1;display:flex;flex-direction:column;gap:8px">${block(16, 'width:60%')}${block(14, 'width:40%')}</div></div>`).join('')}</div>`;
  const sr = '<span class="sr" role="status">Đang tải kế hoạch hôm nay</span>';
  if (frame !== 'phone') return `${sr}<div class="two"><div style="display:flex;flex-direction:column;gap:24px">${heroSk}${listSk}</div><div>${goalSk}</div></div>`;
  return `${sr}<div style="display:flex;flex-direction:column;gap:16px">${heroSk}${listSk}${goalSk}</div>`;
}

function homeBody(frame, state) {
  if (state === 'loading') return skeleton(frame);
  if (state === 'error') {
    return `<div class="empty" data-stagger style="padding-top:${frame === 'phone' ? 120 : 160}px" role="alert">
      <div class="error-icon"><span class="ms lg">cloud_off</span></div><h2 class="t-title2">Chưa tải được kế hoạch hôm nay</h2>
      <p class="t-callout muted">Kiểm tra kết nối rồi thử lại nhé.</p>
      <button class="btn btn-primary" data-action="retry"><span class="ms">refresh</span>Thử lại</button></div>`;
  }
  if (state === 'empty') {
    const empty = `<div class="card empty" data-stagger style="padding:40px 24px">${illustration(frame, ILLO_BOOK)}
      <h2 class="t-title1" style="margin-top:8px">Chào bạn!</h2>
      <p class="t-callout muted" style="max-width:340px">Làm một bài Reading 20 phút để biết bạn đang ở đâu. Kế hoạch hằng ngày sẽ dựa trên kết quả này.</p>
      <button class="btn btn-primary" data-action="continue"><span class="ms">play_arrow</span>Làm bài đầu tiên</button>
      <button class="btn btn-text">Xem các bộ đề</button></div>`;
    const goal = `<article class="card goal" data-stagger aria-label="Mục tiêu tuần: 0 trên 5 buổi"><div class="goal-ring">${ring(84, 10, 0, 'tertiary')}<div class="center"><div><div class="t-title3 tnum">0/5</div><div class="t-caption2 muted">buổi</div></div></div></div>
      <div class="grow"><h2 class="t-headline">Mục tiêu tuần</h2><p class="t-subheadline muted">5 buổi, mỗi buổi 20 phút · Band 7.0</p></div></article>`;
    if (frame === 'phone') return `${empty}${goal}`;
    return `<div class="two"><div>${empty}</div><div>${goal}</div></div>`;
  }
  const s = SCENARIOS[state];
  const banner = state === 'offline' ? `<div class="banner" data-stagger role="status"><span class="ms">cloud_off</span><div class="t-subheadline"><strong>Đang ngoại tuyến</strong> · Bài làm vẫn được lưu và sẽ đồng bộ khi có mạng.</div></div>` : '';
  if (frame === 'phone') return `${banner}${hero(frame, s)}${plan(s)}${goalCard(s)}${s.back ? '' : weakCard()}`;
  return `${banner}<div class="two"><div>${hero(frame, s)}${plan(s)}</div><div>${goalCard(s)}${s.back ? '' : weakCard()}</div></div>`;
}

function homeView(frame, state) {
  const s = SCENARIOS[state];
  return `${largeTitle(frame, s || SCENARIOS.progress, state !== 'empty' && state !== 'error' && state !== 'loading')}<div class="pad">${homeBody(frame, state)}</div>`;
}

function stubView(key, frame) {
  return `<div class="lt" data-stagger><h1 class="t-large-title">${titleOf(key)}</h1></div><div class="pad"><article class="card" data-stagger style="padding:20px;display:flex;flex-direction:column;gap:8px">
    <p class="t-callout muted">Gốc của tab này được trình bày trong mockup điều hướng.</p><a class="btn btn-secondary" href="navigation.html" style="align-self:flex-start;text-decoration:none">Mở navigation.html</a></article></div>`;
}

function screen(frame, state) {
  const due = (SCENARIOS[state] || SCENARIOS.progress).due;

  const label = (key, name) => (key === 'vocab' && due ? `${name}, ${due} thẻ đến hạn` : name);
  const s = SCENARIOS[state];
  const base = `<div class="nav-host"><div class="layer base"><div class="topbar"><span class="t-headline bar-title">Hôm nay</span></div>
    <div class="screen">${frame === 'desktop' ? `<div class="content view">${homeView(frame, state)}</div>` : `<div class="view">${homeView(frame, state)}</div>`}</div></div></div>`;
  if (frame === 'phone') {
    const tabs = DESTINATIONS.map(([key, name, icon]) => `<button class="tab" role="tab" data-tab="${key}" aria-selected="${key === 'home'}" aria-label="${label(key, name)}"><span class="ms">${icon}</span>${name}${badge(key)}</button>`).join('');
    return `<div class="status"><span>9:41</span><span class="icons"><span class="ms">signal_cellular_alt</span><span class="ms">${state === 'offline' ? 'wifi_off' : 'wifi'}</span><span class="ms">battery_full</span></span></div>
      ${base}<nav class="tabbar" role="tablist" aria-label="Điều hướng chính">${tabs}</nav><div class="home-ind"></div>`;
  }
  const streak = s ? s.streak : 0;
  if (frame === 'tablet') {
    const items = DESTINATIONS.map(([key, name, icon]) => `<button class="rail-item" role="tab" data-tab="${key}" aria-selected="${key === 'home'}" aria-label="${label(key, name)}"><span class="pill"><span class="ms">${icon}</span></span>${name}${badge(key)}</button>`).join('');
    return `<div class="status"><span>9:41</span><span class="icons"><span class="ms">${state === 'offline' ? 'wifi_off' : 'wifi'}</span><span class="ms">battery_full</span></span></div>
      <div class="win-body"><nav class="rail" aria-label="Điều hướng chính"><button class="icon-btn" aria-label="Tìm kiếm" data-action="search"><span class="ms">search</span></button><div role="tablist" style="display:flex;flex-direction:column;gap:12px">${items}</div>
      <button class="rail-streak" data-action="streak" aria-label="Chuỗi ${streak} ngày, mở chi tiết"><span class="ms ${streak ? 'fill' : ''}">local_fire_department</span><span class="tnum">${streak}</span></button></nav><div class="main">${base}</div></div><div class="home-ind"></div>`;
  }
  const items = DESTINATIONS.map(([key, name, icon], i) => `<button class="side-item" role="tab" data-tab="${key}" aria-selected="${key === 'home'}" aria-label="${label(key, name)}"><span class="ms">${icon}</span>${name}${badge(key)}</button>`).join('');
  return `<div class="win-bar"><i></i><i></i><i></i><span>Luyện IELTS</span></div>
    <div class="win-body"><nav class="sidebar" aria-label="Điều hướng chính">
      <div class="brand"><span class="brand-mark">L</span><span class="t-headline">Luyện IELTS</span></div>
      <button class="side-search" data-action="search"><span class="ms sm">search</span>Tìm kiếm<kbd>⌘K</kbd></button>
      <div role="tablist" style="display:flex;flex-direction:column;gap:2px">${items}</div>
      <div class="side-foot"><div class="card"><button class="row" data-action="streak" aria-label="Chuỗi ${streak} ngày, mở chi tiết" style="min-height:56px">
        <span class="tile tertiary"><span class="ms ${streak ? 'fill' : ''}">local_fire_department</span></span><div class="grow"><div class="t-headline tnum">${streak ? `${streak} ngày` : 'Chuỗi mới'}</div><div class="t-footnote muted">${streak ? 'Chuỗi hiện tại' : 'Bắt đầu hôm nay'}</div></div></button></div>
        <div class="sync">${state === 'offline' ? '<span class="ms">cloud_off</span>Ngoại tuyến' : '<span class="ms">cloud_done</span>Đã đồng bộ · 2 phút trước'}</div></div>
    </nav><div class="main">${base}</div></div>`;
}

function mount(device, frame) {
  const s = SCENARIOS[ui.state] ? { ...SCENARIOS[ui.state], done: [...SCENARIOS[ui.state].done] } : null;
  device.planState = s;
  const baseLayer = device.querySelector('.layer.base');
  const scroller = baseLayer.querySelector('.screen');
  scroller.addEventListener('scroll', () => baseLayer.classList.toggle('scrolled', scroller.scrollTop > 44));
  device.addEventListener('click', (event) => {
    const target = event.target.closest('[data-action], [data-tab]');
    if (!target || !device.contains(target)) return;
    if (target.dataset.tab) return switchTab(device, frame, target.dataset.tab);
    const action = target.dataset.action;
    if (action === 'continue') openMorph(device, frame, target.closest('[data-shared]') || target, roomMini(frame), true);
    if (action === 'review') openMorph(device, frame, target, reviewMini(), false, () => completePlan(device, frame, 'review'));
    if (action === 'plan-start') {
      const first = device.querySelector('[data-plan]:not(.done)');
      if (first) first.click();
    }
    if (action === 'type') push(device, frame, typeDetail(frame), () => completePlan(device, frame, 'type'));
    if (action === 'dictation') { event.stopPropagation(); openDictation(device, frame, target.closest('[data-plan]').querySelector('.play-inline') || target); }
    if (action === 'streak') openSheet(device, frame, streakSheet(device.planState), 'Chuỗi ngày');
    if (action === 'see-all' || action === 'more') log(`Chuyển sang tab ${action === 'more' ? 'Luyện đề' : 'Tiến độ'} · xem <a href="${action === 'more' ? 'navigation.html' : 'progress.html'}">mockup</a>`);
    if (action === 'search') log('Tìm kiếm toàn cục · xem <a href="navigation.html">navigation.html</a>');
    if (action === 'retry') { ui.state = 'loading'; syncControls(); render(); setTimeout(() => { ui.state = 'progress'; syncControls(); render(); }, 1400); }
  });
  enter(device);
  if (ui.state === 'goal') setTimeout(() => {
    const center = device.querySelector('[data-goal-center]');
    play(center, [{ transform: 'scale(0.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], 'bouncy', { delay: 500 });
    haptic(device, 'success · CONFIRM (một lần mỗi tuần)');
  }, 0);
}

function completePlan(device, frame, kind) {
  const s = device.planState;
  if (!s) return;
  const index = planItems(s).findIndex(([k]) => k === kind);
  if (index < 0 || s.done[index]) return;
  const before = s.done.filter(Boolean).length;
  s.done[index] = true;
  const row = device.querySelector(`[data-plan="${kind}"]`);
  const fresh = document.createElement('div');
  fresh.innerHTML = planRow(planItems(s)[index], true);
  const doneRow = fresh.firstElementChild;
  row.replaceWith(doneRow);
  play(doneRow.querySelector('.done-mark'), [{ transform: 'scale(0.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], 'bouncy', { delay: 200, fallback: [{ opacity: 1 }, { opacity: 1 }] });
  const counter = device.querySelector('[data-plan-count]');
  const total = s.done.length;
  counter.innerHTML = `${roller(`${before + 1}/${total}`)} · ${s.back ? 5 : 20} phút`;
  roll(counter, `${before}${total}`);
  if (before + 1 < total) return;
  haptic(device, 'success · CONFIRM (xong kế hoạch)');
  s.sessions += 1;
  s.week = s.week.map((v) => (v === 'today' ? 'today-on' : v));
  s.streak += 1;
  setTimeout(() => {
    swapCard(device.querySelector('[data-shared="hero"]'), hero(frame, s));
    swapCard(device.querySelector('[data-goal]'), goalCard(s), true);
  }, 600);
}

async function swapCard(old, html, isGoal) {
  if (!old) return;
  const holder = document.createElement('div');
  holder.innerHTML = html;
  const next = holder.firstElementChild;
  next.removeAttribute('data-stagger');
  await play(old, [{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: EASING.accelerate });
  old.replaceWith(next);
  play(next, [{ opacity: 0, transform: 'scale(0.98)' }, { opacity: 1, transform: 'none' }], { duration: 160, easing: EASING.decelerate }, { fallback: [{ opacity: 0 }, { opacity: 1 }] });
  if (!isGoal) return;
  const circle = next.querySelector('.ring .fill');
  const length = Number(circle.dataset.length);
  const s = (next.closest('.device') || {}).planState;
  const from = length * (1 - Math.max(0, (s ? s.sessions - 1 : 0) / 5));
  play(circle, [{ strokeDashoffset: from }, { strokeDashoffset: circle.dataset.offset }], 'gentle');
  next.querySelectorAll('.roller').forEach((r) => roll(r));
}

async function switchTab(device, frame, key) {
  const current = device.querySelector('[data-tab][aria-selected="true"]');
  if (current.dataset.tab === key) {
    const scroller = device.querySelector('.layer.base .screen');
    const pages = device.querySelectorAll('.layer.page');
    if (pages.length) return pages[pages.length - 1].popPage();
    return scroller.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  device.querySelectorAll('[data-tab]').forEach((tab) => tab.setAttribute('aria-selected', String(tab.dataset.tab === key)));
  haptic(device, 'selection · CLOCK_TICK');
  const view = device.querySelector('.layer.base .view');
  await play(view, [{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: EASING.accelerate });
  view.innerHTML = key === 'home' ? homeView(frame, ui.state) : stubView(key, frame);
  device.querySelector('.layer.base .bar-title').textContent = titleOf(key);
  play(view, [{ opacity: 0, transform: 'scale(0.98)' }, { opacity: 1, transform: 'none' }], { duration: 160, easing: EASING.decelerate }, { fallback: [{ opacity: 0 }, { opacity: 1 }] });
}

function typeDetail(frame) {
  const top = frame === 'phone' ? 104 : frame === 'tablet' ? 88 : 72;
  return `<div class="topbar solid"><button class="back" data-action="back" aria-label="Quay lại Hôm nay"><span class="ms">chevron_left</span>Hôm nay</button><span class="t-headline bar-title">Matching Headings</span></div>
  <div class="screen" style="padding-top:${top}px"><div class="${frame === 'desktop' ? 'content' : ''}" style="padding:0 ${frame === 'phone' ? 20 : 0}px">
    <article class="card" style="padding:20px;display:flex;flex-direction:column;gap:6px"><h1 class="t-title1">Matching Headings</h1>
      <p class="t-subheadline muted">58% đúng · 31 câu trong 30 ngày</p><div class="pbar" style="margin:8px 0"><i style="width:58%;background:var(--tertiary)"></i></div>
      <button class="btn btn-primary ${frame === 'phone' ? 'btn-block' : ''}" data-action="finish-drill" style="margin-top:8px;align-self:flex-start"><span class="ms">play_arrow</span>Bắt đầu luyện 12 phút</button></article>
    <div class="section-h"><h2 class="t-title3">Mẹo</h2></div>
    <div class="list"><div class="row"><span class="tile info"><span class="ms">lightbulb</span></span><div class="grow t-subheadline">Đọc câu đầu và câu cuối của đoạn trước, rồi mới xem danh sách heading.</div></div>
      <div class="row"><span class="tile info"><span class="ms">lightbulb</span></span><div class="grow t-subheadline">Heading tóm ý chính của cả đoạn, không phải một chi tiết nhỏ.</div></div></div>
    <div class="section-h"><h2 class="t-title3">Bộ câu gợi ý</h2></div>
    <div class="list">${[['Cambridge 17 · Test 1 · Passage 3', '6 câu · đã làm 4/6', 'Đang làm'], ['Cambridge 16 · Test 3 · Passage 1', '7 câu', 'Chưa làm'], ['Cambridge 15 · Test 2 · Passage 2', '6 câu', 'Chưa làm']].map(([t, s, tag]) => `<div class="row"><div class="grow"><div class="t-headline">${t}</div><div class="t-subheadline muted">${s}</div></div><span class="tag ${tag === 'Đang làm' ? 'primary' : ''}">${tag}</span></div>`).join('')}</div>
    <p class="t-footnote muted" style="padding:16px 4px">Mockup: bấm "Bắt đầu luyện" để giả lập đã luyện xong và quay lại Hôm nay.</p>
  </div></div>`;
}

function push(device, frame, html, onFinish) {
  const host = device.querySelector('.nav-host');
  const base = host.querySelector('.layer.base');
  const page = document.createElement('div');
  page.className = 'layer page';
  page.style.zIndex = 10;
  page.innerHTML = html;
  const dim = document.createElement('div');
  dim.className = 'dim';
  base.append(dim);
  host.append(page);
  play(page, [{ transform: 'translateX(100%)' }, { transform: 'translateX(0)' }], 'smooth', { fallback: [{ opacity: 0 }, { opacity: 1 }] });
  play(base, [{ transform: 'translateX(0)' }, { transform: 'translateX(-30%)' }], 'smooth');
  play(dim, [{ opacity: 0 }, { opacity: 0.08 }], 'smooth');
  page.popPage = (from = 0) => {
    const width = page.offsetWidth;
    play(page, [{ transform: `translateX(${from * width}px)` }, { transform: 'translateX(100%)' }], 'smooth', { fallback: [{ opacity: 1 }, { opacity: 0 }] }).then(() => page.remove());
    play(base, [{ transform: `translateX(${-0.3 * width * (1 - from)}px)` }, { transform: 'translateX(0)' }], 'smooth');
    play(dim, [{ opacity: 0.08 * (1 - from) }, { opacity: 0 }], 'smooth').then(() => dim.remove());
  };
  page.addEventListener('click', (event) => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    event.stopPropagation();
    if (button.dataset.action === 'back') page.popPage();
    if (button.dataset.action === 'finish-drill') { page.popPage(); setTimeout(onFinish, 350); }
  });
  enableEdgeSwipe(page, base, dim);
}

function enableEdgeSwipe(page, base, dim) {
  let startX = null, lastX = 0, lastT = 0, velocity = 0;
  const scale = () => Number(page.closest('.device').dataset.scale);
  page.addEventListener('pointerdown', (event) => {
    const x = (event.clientX - page.getBoundingClientRect().left) / scale();
    if (x > 28) return;
    startX = event.clientX; lastX = event.clientX; lastT = event.timeStamp;
    page.setPointerCapture(event.pointerId);
    [page, base, dim].forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
  });
  page.addEventListener('pointermove', (event) => {
    if (startX === null) return;
    const dx = Math.max(0, (event.clientX - startX) / scale());
    velocity = (event.clientX - lastX) / scale() / Math.max(1, event.timeStamp - lastT);
    lastX = event.clientX; lastT = event.timeStamp;
    const progress = dx / page.offsetWidth;
    page.style.transform = `translateX(${dx}px)`;
    base.style.transform = `translateX(${-0.3 * page.offsetWidth * (1 - progress)}px)`;
    dim.style.opacity = 0.08 * (1 - progress);
  });
  page.addEventListener('pointerup', (event) => {
    if (startX === null) return;
    const progress = Math.max(0, (event.clientX - startX) / scale()) / page.offsetWidth;
    startX = null;
    if (progress > 0.35 || velocity > 0.5) return page.popPage(progress);
    play(page, [{ transform: `translateX(${progress * page.offsetWidth}px)` }, { transform: 'translateX(0)' }], 'smooth');
    play(base, [{ transform: `translateX(${-0.3 * page.offsetWidth * (1 - progress)}px)` }, { transform: 'translateX(-30%)' }], 'smooth');
    dim.style.opacity = 0.08;
  });
}

function roomMini(frame) {
  const passage = `<div class="passage t-reading"><p class="t-caption muted" style="margin-bottom:8px">READING PASSAGE 2</p>
    <h2 class="t-title2" style="margin-bottom:12px">Ageing without decline</h2>
    <p>Most animals slow down as they age. Muscles weaken, memory fades and reactions become less precise. Yet a small number of species appear to escape this pattern for most of their lives.</p>
    <p>One candidate is a species of ant found in the forests of the south-eastern United States. <mark>Workers near the end of their lives seem to perform their duties just as well as those that have only recently emerged.</mark></p></div>`;
  const questions = `<div><p class="t-headline">Questions 14–19</p><p class="t-subheadline muted" style="margin:4px 0 8px">Do the following statements agree with the information given in Reading Passage 2?</p>
    ${[['18', 'Older workers were less successful at caring for larvae than younger ones.', '']].map(([n, s]) => `<div class="q"><span class="qn">${n}</span><div class="grow"><p class="t-body">${s}</p><div class="chips">${['TRUE', 'FALSE', 'NOT GIVEN'].map((c) => `<button class="chip">${c}</button>`).join('')}</div></div></div>`).join('')}</div>`;
  return `<div class="room"><div class="exam-bar"><button class="icon-btn" data-action="close-room" aria-label="Thoát bài thi"><span class="ms">close</span></button>
    <span class="t-headline grow">${frame === 'phone' ? 'Passage 2' : 'Cambridge 18 · Test 2 · Reading'}</span>
    <span class="timer" aria-label="Còn 34 phút"><span class="ms">timer</span>34:00</span></div>
    <div class="room-body">${frame === 'phone' ? passage : `<div>${passage}</div><div>${questions}</div>`}</div></div>`;
}

function reviewMini() {
  return `<div class="review-mini"><div class="bar"><button class="icon-btn" data-action="close-room" aria-label="Đóng phiên ôn"><span class="ms">close</span></button><span class="t-label tnum">1/24</span></div>
    <div class="review-face"><span class="tag">adj</span><h2 class="t-large-title">meticulous</h2><p class="t-callout muted">/məˈtɪk.jə.ləs/</p><span class="audio"><span class="ms fill">volume_up</span></span></div>
    <div class="foot"><button class="btn btn-primary btn-block" data-action="close-room" data-complete style="height:56px"><span class="ms">check</span>Giả lập ôn xong 24 thẻ</button></div></div>`;
}

function morphTarget(frame) {
  if (frame === 'phone') return { x: 0, y: 0, w: 390, h: 844, r: 54 };
  if (frame === 'tablet') return { x: 0, y: 0, w: 834, h: 1112, r: 36 };
  return { x: 0, y: 38, w: 1280, h: 762, r: 0 };
}

function clipFor(from, to, radius) {
  return `inset(${from.y - to.y}px ${to.x + to.w - from.x - from.w}px ${to.y + to.h - from.y - from.h}px ${from.x - to.x}px round ${radius}px)`;
}

function openMorph(device, frame, source, html, confirmExit, onComplete) {
  const from = localRect(device, source);
  const to = morphTarget(frame);
  const radius = Number.parseFloat(getComputedStyle(source).borderTopLeftRadius) || 14;
  const morph = document.createElement('div');
  morph.className = 'morph';
  Object.assign(morph.style, { left: `${to.x}px`, top: `${to.y}px`, width: `${to.w}px`, height: `${to.h}px` });
  morph.innerHTML = html;
  const content = morph.firstElementChild;
  const ghost = source.cloneNode(true);
  ghost.classList.add('ghost');
  Object.assign(ghost.style, { left: `${from.x - to.x}px`, top: `${from.y - to.y}px`, width: `${from.w}px`, height: `${from.h}px`, margin: 0, background: 'var(--card)' });
  morph.append(ghost);
  device.append(morph);
  haptic(device, 'impact light · CONTEXT_CLICK');
  play(morph, [{ clipPath: clipFor(from, to, radius) }, { clipPath: `inset(0px 0px 0px 0px round ${to.r}px)` }], 'smooth', { fallback: [{ opacity: 0 }, { opacity: 1 }] });
  play(ghost, [{ opacity: 1 }, { opacity: 0, offset: 0.35 }, { opacity: 0 }], 'smooth', { fallback: [{ opacity: 0 }, { opacity: 0 }] });
  play(content, [{ opacity: 0 }, { opacity: 0, offset: 0.25 }, { opacity: 1, offset: 0.7 }, { opacity: 1 }], 'smooth', { fallback: [{ opacity: 1 }, { opacity: 1 }] });
  morph.addEventListener('click', (event) => {
    const button = event.target.closest('[data-action="close-room"]');
    if (!button) return;
    event.stopPropagation();
    const close = () => {
      const back = source.isConnected ? localRect(device, source) : from;
      play(morph, [{ clipPath: `inset(0px 0px 0px 0px round ${to.r}px)` }, { clipPath: clipFor(back, to, radius) }], 'smooth', { fallback: [{ opacity: 1 }, { opacity: 0 }] }).then(() => {
        morph.remove();
        if (button.dataset.complete !== undefined && onComplete) onComplete();
      });
      play(ghost, [{ opacity: 0 }, { opacity: 0, offset: 0.5 }, { opacity: 1 }], 'smooth', { fallback: [{ opacity: 0 }, { opacity: 0 }] });
      play(content, [{ opacity: 1 }, { opacity: 0, offset: 0.5 }, { opacity: 0 }], 'smooth', { fallback: [{ opacity: 1 }, { opacity: 1 }] });
    };
    if (!confirmExit) return close();
    const timer = morph.querySelector('.timer .ms');
    timer.textContent = 'pause';
    let exiting = false;
    const closeSheet = openSheet(device, frame, `<div class="handle"></div><h2 class="t-title2">Thoát bài thi?</h2>
      <p class="t-callout muted" style="margin-top:6px">Bài làm được lưu. Đồng hồ tạm dừng, bạn làm tiếp được từ Hôm nay.</p>
      <div style="display:flex;gap:8px;margin-top:24px"><button class="btn btn-text" data-confirm-exit style="flex:1">Thoát</button><button class="btn btn-primary" data-action="close-sheet" data-autofocus style="flex:1">Làm tiếp</button></div>`,
      'Thoát bài thi', { onClose: () => { if (!exiting) timer.textContent = 'timer'; } });
    device.querySelector('[data-confirm-exit]').addEventListener('click', (confirm) => { confirm.stopPropagation(); exiting = true; closeSheet(); close(); });
  });
}

const SENTENCES = [
  'The museum will be closed on Mondays during the winter.',
  'Visitors are advised to book their tickets in advance.',
  'The new exhibition focuses on the history of local farming.',
];
const tokens = (text) => text.toLowerCase().replace(/[^a-z' ]/g, ' ').split(/\s+/).filter(Boolean);

function dictationStep(index) {
  return `<div class="handle"></div>
    <div class="dict-head"><span class="tile correct" style="width:40px;height:40px;border-radius:12px"><span class="ms">headphones</span></span>
      <div class="grow"><h2 class="t-title2" id="dict-title">Nghe chép nhanh</h2><p class="t-footnote muted">Cambridge 17 · Test 3 · Section 2</p></div>
      <div class="steps" aria-label="Câu ${index + 1} trên 3">${[0, 1, 2].map((i) => `<i class="${i <= index ? 'on' : ''}"></i>`).join('')}</div></div>
    <div class="dict-player"><button class="audio" data-dict="play" aria-label="Nghe câu ${index + 1}" data-autofocus><span class="ms fill">play_arrow</span></button>
      <div class="grow"><div class="t-label tnum">Câu ${index + 1}/3</div><div class="pbar" style="margin-top:8px"><i data-manual></i></div></div>
      <button class="speed" data-dict="speed" aria-label="Tốc độ phát">1×</button></div>
    <input class="dict-field" data-dict="field" placeholder="Gõ những gì bạn nghe…" aria-label="Câu bạn nghe được" autocomplete="off" spellcheck="false">
    <div class="dict-feedback" aria-live="polite"></div>
    <div class="dict-actions"><button class="btn btn-primary" data-dict="check" disabled>Kiểm tra</button></div>`;
}

function dictationDone(score) {
  return `<div class="handle"></div><div class="empty" style="padding:8px 0 0">
    <div class="tile correct" style="width:64px;height:64px;border-radius:999px"><span class="ms fill lg">check</span></div>
    <h2 class="t-title2" id="dict-title">Xong 3 câu!</h2>
    <p class="t-callout muted">${score}% từ đúng${score < 100 ? ' · 1 từ cần ôn: <em>exhibition</em>' : ''}</p>
    <div class="dict-actions" style="width:100%"><button class="btn btn-secondary" data-dict="save">Lưu từ</button><button class="btn btn-primary" data-dict="finish" data-autofocus>Xong</button></div></div>`;
}

function openDictation(device, frame, opener) {
  if (ui.state === 'offline') {
    return openSheet(device, frame, `<div class="handle"></div><h2 class="t-title2">Nghe chép nhanh</h2><p class="t-callout muted" style="margin-top:6px">Câu này chưa được tải về máy. Kết nối mạng để nghe nhé.</p><button class="btn btn-primary btn-block" data-action="close-sheet" data-autofocus style="margin-top:24px">Đóng</button>`, 'Nghe chép nhanh');
  }
  let index = 0, correct = 0, total = 0, finished = false;
  const close = openSheet(device, frame, dictationStep(0), 'Nghe chép nhanh', { onClose: () => { if (!finished && index > 0) log(`Đã lưu tiến độ: hàng hiện "Đang làm · ${index}/3 câu"`); } });
  const sheet = device.querySelector('.sheet-layer:last-of-type .sheet');
  const playButton = sheet.querySelector('[data-dict="play"]');
  if (opener && !reduceMotion) {
    const from = localRect(device, opener), to = localRect(device, playButton);
    play(playButton, [{ transform: `translate(${from.x - to.x}px, ${from.y - to.y}px) scale(${from.w / to.w})` }, { transform: 'none' }], 'smooth');
  }
  const wire = () => {
    const field = sheet.querySelector('[data-dict="field"]');
    const check = sheet.querySelector('[data-dict="check"]');
    if (field) field.addEventListener('input', () => { check.disabled = !field.value.trim(); });
    if (field) field.addEventListener('keydown', (event) => { if (event.key === 'Enter' && field.value.trim()) check.click(); });
  };
  wire();
  sheet.addEventListener('click', (event) => {
    const button = event.target.closest('[data-dict]');
    if (!button) return;
    event.stopPropagation();
    const kind = button.dataset.dict;
    if (kind === 'play') playSentence(sheet, SENTENCES[index]);
    if (kind === 'speed') button.textContent = button.textContent === '1×' ? '0.75×' : '1×';
    if (kind === 'check') {
      const field = sheet.querySelector('[data-dict="field"]');
      const typed = tokens(field.value);
      const answer = SENTENCES[index].split(' ');
      const marked = answer.map((word) => {
        const clean = tokens(word)[0];
        const ok = typed.includes(clean);
        if (ok) correct += 1;
        total += 1;
        return ok ? `<span class="w-ok">${word}</span>` : `<span class="w-bad">${word}<span class="sr"> (sai hoặc thiếu)</span></span>`;
      });
      const good = answer.filter((w) => typed.includes(tokens(w)[0])).length;
      sheet.querySelector('.dict-feedback').innerHTML = `<div>${marked.join(' ')}</div><p class="t-footnote muted" style="margin-top:6px">Đúng ${good}/${answer.length} từ</p>`;
      field.disabled = true;
      button.outerHTML = `<button class="btn btn-primary" data-dict="next">${index < 2 ? 'Câu tiếp' : 'Xem kết quả'}</button>`;
      play(sheet.querySelector('.dict-feedback'), [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], 'smooth');
      sheet.querySelector('[data-dict="next"]').focus();
    }
    if (kind === 'next') {
      index += 1;
      const html = index < 3 ? dictationStep(index) : dictationDone(Math.round((correct / total) * 100));
      play(sheet, [{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: EASING.accelerate }).then(() => {
        sheet.innerHTML = html;
        play(sheet, [{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], 'smooth', { fallback: [{ opacity: 0 }, { opacity: 1 }] });
        wire();
        (sheet.querySelector('[data-autofocus]') || sheet).focus();
        if (index === 3) haptic(device, 'success · CONFIRM');
      });
    }
    if (kind === 'save') { button.textContent = 'Đã lưu'; button.disabled = true; }
    if (kind === 'finish') { finished = true; close(); setTimeout(() => completePlan(device, frame, 'dictation'), 300); }
  });
}

function playSentence(sheet, text) {
  const button = sheet.querySelector('[data-dict="play"]');
  const bar = sheet.querySelector('.dict-player .pbar > i');
  const slow = sheet.querySelector('[data-dict="speed"]').textContent !== '1×';
  const duration = text.split(' ').length * (slow ? 420 : 320);
  button.querySelector('.ms').textContent = 'pause';
  button.setAttribute('aria-label', 'Tạm dừng');
  bar.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration, easing: 'linear', fill: 'forwards' }).finished.then(() => {
    button.querySelector('.ms').textContent = 'replay';
    button.setAttribute('aria-label', 'Nghe lại');
  });
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-GB';
    utterance.rate = slow ? 0.75 : 0.95;
    speechSynthesis.speak(utterance);
  }
}

function streakSheet(s) {
  const st = s || SCENARIOS.progress;
  const labels = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
  const active = st.week.includes('today-on');
  const text = !st.streak ? 'Bắt đầu chuỗi mới hôm nay nhé.' : active ? 'Hôm nay bạn đã học 22 phút.' : `Học 5 phút hôm nay để lên ${st.streak + 1} ngày.`;
  return `<div class="handle"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span class="tile tertiary" style="width:48px;height:48px;border-radius:14px"><span class="ms fill lg">local_fire_department</span></span>
      <div><h2 class="t-title2">${st.streak ? `Chuỗi ${st.streak} ngày` : 'Chuỗi mới'}</h2><p class="t-subheadline muted">Kỷ lục của bạn: 21 ngày</p></div></div>
    <p class="t-headline" style="margin-top:8px">${text}</p>
    <div class="week" style="justify-content:space-between;margin:16px 0 20px" role="img" aria-label="Tuần này">${st.week.map((v, i) => `<span class="${String(v).startsWith('today') ? 'today' : ''}" style="width:40px"><i class="${v === 1 || v === 'today-on' ? 'on' : v === 'rest' ? 'rest' : ''}" style="width:28px;height:28px"></i>${labels[i]}</span>`).join('')}</div>
    <p class="t-callout muted">Học ít nhất 5 phút mỗi ngày để giữ chuỗi. Lỡ một ngày cũng không sao: mỗi tuần bạn có một ngày nghỉ mà chuỗi vẫn được giữ.</p>
    <div style="display:flex;gap:8px;margin-top:24px"><button class="btn btn-text" style="flex:1" data-action="see-all">Xem lịch học</button><button class="btn btn-primary" data-action="close-sheet" data-autofocus style="flex:1">Đã hiểu</button></div>`;
}

function openSheet(device, frame, html, label, { dismissible = true, onClose = () => { } } = {}) {
  const opener = document.activeElement;
  const layer = document.createElement('div');
  layer.className = 'sheet-layer';
  layer.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}">${html}</div>`;
  device.append(layer);
  const sheet = layer.querySelector('.sheet'), scrim = layer.querySelector('.scrim');
  const phone = frame === 'phone';
  play(scrim, [{ opacity: 0 }, { opacity: 1 }], 'smooth');
  play(sheet, phone ? [{ transform: 'translateY(100%)' }, { transform: 'none' }] : [{ opacity: 0, transform: 'scale(0.96)' }, { opacity: 1, transform: 'none' }], 'smooth', { fallback: [{ opacity: 0 }, { opacity: 1 }] });
  const initial = sheet.querySelector('[data-autofocus]') || sheet.querySelector('h2');
  if (!initial.matches('button, input')) initial.setAttribute('tabindex', '-1');
  initial.focus({ preventScroll: true });
  let closed = false;
  const close = (fromY = 0) => {
    if (closed) return;
    closed = true;
    onClose();
    play(scrim, [{ opacity: Math.max(0, 1 - fromY / sheet.offsetHeight) }, { opacity: 0 }], 'smooth');
    play(sheet, phone ? [{ transform: `translateY(${fromY}px)` }, { transform: 'translateY(100%)' }] : [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(0.96)' }], 'smooth', { fallback: [{ opacity: 1 }, { opacity: 0 }] }).then(() => {
      layer.remove();
      if (opener && opener.isConnected) opener.focus({ preventScroll: true });
    });
  };
  layer.addEventListener('keydown', (event) => {
    event.stopPropagation();
    if (event.key === 'Escape' && dismissible) return close();
    if (event.key !== 'Tab') return;
    const focusable = [...sheet.querySelectorAll('button:not([disabled]), input:not([disabled])')];
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && (document.activeElement === first || !sheet.contains(document.activeElement))) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  if (dismissible) scrim.addEventListener('click', () => close());
  sheet.addEventListener('click', (event) => {
    const button = event.target.closest('[data-action="close-sheet"], [data-action="see-all"]');
    if (!button) return;
    event.stopPropagation();
    close();
    if (button.dataset.action === 'see-all') log('Chuyển sang Tiến độ, cuộn tới lịch học · xem <a href="progress.html">progress.html</a>');
  });
  if (!phone || !dismissible) return close;
  let startY = null, lastY = 0, lastT = 0, velocity = 0;
  const scale = Number(device.dataset.scale);
  sheet.addEventListener('pointerdown', (event) => {
    if (event.target.closest('button, input')) return;
    startY = event.clientY; lastY = event.clientY; lastT = event.timeStamp;
    sheet.setPointerCapture(event.pointerId);
    sheet.getAnimations().forEach((a) => a.cancel());
  });
  sheet.addEventListener('pointermove', (event) => {
    if (startY === null) return;
    const dy = Math.max(0, (event.clientY - startY) / scale);
    velocity = (event.clientY - lastY) / scale / Math.max(1, event.timeStamp - lastT);
    lastY = event.clientY; lastT = event.timeStamp;
    sheet.style.transform = `translateY(${dy}px)`;
    scrim.style.opacity = 1 - dy / sheet.offsetHeight;
  });
  sheet.addEventListener('pointerup', (event) => {
    if (startY === null) return;
    const dy = Math.max(0, (event.clientY - startY) / scale);
    startY = null;
    if (dy > sheet.offsetHeight * 0.3 || velocity > 0.6) return close(dy);
    play(sheet, [{ transform: `translateY(${dy}px)` }, { transform: 'none' }], 'smooth');
    play(scrim, [{ opacity: 1 - dy / sheet.offsetHeight }, { opacity: 1 }], 'smooth');
  });
  return close;
}

const FRAME_NAMES = { phone: 'Điện thoại 390 × 844', tablet: 'Máy tính bảng 834 × 1112', desktop: 'Máy tính 1280 × 800' };
const SIZES = { phone: [390, 844], tablet: [834, 1112], desktop: [1280, 800] };
const THEME_NAMES = { light: 'Sáng', dark: 'Tối' };

function fit(scaler, device, frame) {
  const [width, height] = SIZES[frame];
  const limit = frame === 'tablet' ? 0.62 : 1;
  const scale = Math.min(limit, (window.innerWidth - 64) / width);
  scaler.style.width = `${width * scale}px`;
  scaler.style.height = `${height * scale}px`;
  device.style.transform = `scale(${scale})`;
  device.dataset.scale = scale;
}

function render() {
  const stage = document.getElementById('stage');
  const themes = ui.theme === 'both' ? ['light', 'dark'] : [ui.theme];
  const frames = ui.frame === 'both' ? ['phone', 'desktop'] : [ui.frame];
  stage.innerHTML = '';
  for (const frame of frames) {
    for (const theme of themes) {
      const cell = document.createElement('section');
      cell.className = 'cell';
      cell.innerHTML = `<div class="cell-label">${FRAME_NAMES[frame]} · ${THEME_NAMES[theme]}</div><div class="scaler"><div class="device ${frame} ${theme}${reduceMotion ? ' reduce' : ''}">${screen(frame, ui.state)}</div></div>`;
      stage.append(cell);
      const device = cell.querySelector('.device');
      fit(cell.querySelector('.scaler'), device, frame);
      mount(device, frame);
    }
  }
}

function syncControls() {
  document.querySelectorAll('.tb-group[data-control]').forEach((group) => {
    group.querySelectorAll('button').forEach((button) => button.setAttribute('aria-pressed', String(ui[group.dataset.control] === button.dataset.value)));
  });
}

function setupControls() {
  document.querySelector('[data-control="state"]').insertAdjacentHTML('beforeend', STATES.map(([value, label]) => `<button data-value="${value}">${label}</button>`).join(''));
  document.querySelectorAll('.tb-group[data-control]').forEach((group) => {
    group.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      ui[group.dataset.control] = button.dataset.value;
      syncControls();
      render();
    });
  });
  const reduce = document.getElementById('reduce');
  reduce.checked = reduceMotion;
  reduce.addEventListener('change', () => { reduceMotion = reduce.checked; render(); });
  document.getElementById('replay').addEventListener('click', render);
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 200); });
  syncControls();
}

setupControls();
document.fonts.ready.then(render);
</script>
