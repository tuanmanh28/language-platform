name: Deploy backend

# Builds backend/Dockerfile.multistage, pushes it to Artifact Registry and deploys it to Cloud Run.
# Flyway migrates the Neon database when the new revision starts. Setup: docs/deploy.md.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - backend/**
      - core/**
      - content/**
      - gradle/**
      - gradlew
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/deploy-backend.yml

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Pushes skip deploying until Google Cloud is configured; a manual run still explains what is missing.
    if: vars.GCP_PROJECT_ID != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
      REPOSITORY: ${{ vars.GAR_REPOSITORY || 'backend' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'language-platform-api' }}
      AUDIO_BASE_URL: ${{ vars.AUDIO_BASE_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Set the GCP_PROJECT_ID variable (docs/deploy.md, section 7)"
            exit 1
          fi
          if [ -z "$AUDIO_BASE_URL" ]; then
            echo "::error::Set the AUDIO_BASE_URL variable (docs/deploy.md, section 7)"
            exit 1
          fi
          echo "IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/api:$GITHUB_SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build image
        run: docker build -f backend/Dockerfile.multistage -t "$IMAGE" .

      - name: Push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        # "^;^" switches the env var separator to ';' so CORS_ALLOWED_ORIGINS may contain commas.
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --cpu 1 \
            --memory 512Mi \
            --set-env-vars "^;^APP_ENV=prod;CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS;AUDIO_BASE_URL=$AUDIO_BASE_URL" \
            --set-secrets "DATABASE_URL=database-url:latest,DATABASE_USER=database-user:latest,DATABASE_PASSWORD=database-password:latest"

      - name: Smoke test
        run: |
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')"
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$url/health"
