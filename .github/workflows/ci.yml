name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Shared logic + backend + desktop + Android (Ubuntu runners ship the Android SDK)
  jvm-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (core, shared, backend)
        run: ./gradlew :core:model:jvmTest :core:exam-engine:jvmTest :shared:jvmTest :backend:test

      - name: Build Android debug
        run: ./gradlew :app-android:assembleDebug

      - name: Build desktop
        run: ./gradlew :app-desktop:compileKotlin

      - name: Build backend jar
        run: ./gradlew :backend:shadowJar

  # iOS + macOS (SwiftUI) — needs a macOS runner
  apple:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd app-apple && xcodegen

      - name: Build iOS (simulator)
        run: |
          xcodebuild -project app-apple/LanguagePlatform.xcodeproj -scheme LanguagePlatformiOS \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - name: Build macOS
        run: |
          xcodebuild -project app-apple/LanguagePlatform.xcodeproj -scheme LanguagePlatformMac \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO build
